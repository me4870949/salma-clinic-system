    function generateZatcaTlvBase64(sellerName, vatNumber, timeIso, totalAmount, vatAmount) {
      try {
        const encodeTag = (tagNum, strVal) => {
          const utf8 = unescape(encodeURIComponent(strVal || ''));
          const len = utf8.length;
          return String.fromCharCode(tagNum) + String.fromCharCode(len) + utf8;
        };

        const tlvString = 
          encodeTag(1, sellerName || 'مركز سلمي لطب الأسنان والجلدية') +
          encodeTag(2, vatNumber || '310489201900003') +
          encodeTag(3, timeIso || new Date().toISOString()) +
          encodeTag(4, parseFloat(totalAmount || 0).toFixed(2)) +
          encodeTag(5, parseFloat(vatAmount || 0).toFixed(2));

        return btoa(tlvString);
      } catch (err) {
        console.error('ZATCA TLV error:', err);
        return btoa('ZATCA|' + sellerName + '|' + vatNumber + '|' + totalAmount);
      }
    }

        return saved ? JSON.parse(saved) : DEFAULT_SETTINGS;

      // --- 4. Core Clinical & Operational Data States ---

      const [prescriptions, setPrescriptions] = useState(() => {
        const saved = localStorage.getItem('salma_prescriptions');
        return saved ? JSON.parse(saved) : INITIAL_PRESCRIPTIONS;
      });

      const [invoices, setInvoices] = useState(() => {
        const saved = localStorage.getItem('salma_invoices');
        return saved ? JSON.parse(saved) : INITIAL_INVOICES;

      const [selectedPatient, setSelectedPatient] = useState(INITIAL_PATIENTS[0]);
      const [selectedRx, setSelectedRx] = useState(INITIAL_PRESCRIPTIONS[0]);

      const [inputNationalId, setInputNationalId] = useState('1092837461');
      const [inputEmail, setInputEmail] = useState('doctor@salmaclinic.sa');
      const [inputPassword, setInputPassword] = useState('doc123');

      const [selectedTooth, setSelectedTooth] = useState(null);
      const [toothCondition, setToothCondition] = useState('composite-filling');

      const [toothNotes, setToothNotes] = useState('');

      // Dermatology Session State

      const [dermaDevice, setDermaDevice] = useState('Candela GentleMax Pro (Alexandrite 755nm)');
      const [dermaTreatment, setDermaTreatment] = useState('جلسة ليزر كانديلا جنتل برو');

      const [dermaNotes, setDermaNotes] = useState('');

      const [showSlotModal, setShowSlotModal] = useState(false);
      const [slotDate, setSlotDate] = useState('2026-09-04');
      const [slotTime, setSlotTime] = useState('18:00');
      const [slotPatientId, setSlotPatientId] = useState(INITIAL_PATIENTS[0].id);
      const [slotSpecialty, setSlotSpecialty] = useState('dental');
      const [slotDoctor, setSlotDoctor] = useState('د. فهد العنزي');
      const [slotService, setSlotService] = useState('كشف استشاري وخطة علاج أسنان');
      const [slotPrice, setSlotPrice] = useState(150);

      // Doctor Commission Rate Live Adjuster
      const [editingDocId, setEditingDocId] = useState(null);
      const [tempRate, setTempRate] = useState('30');

      const [waPatientId, setWaPatientId] = useState(INITIAL_PATIENTS[0].id);

      const [waPhone, setWaPhone] = useState(INITIAL_PATIENTS[0].phone);
      const [waMessage, setWaMessage] = useState('');
      const [waStatusLog, setWaStatusLog] = useState([]);

      // Settings Form Local State
      const [settingsForm, setSettingsForm] = useState(settings);

      // --- Sync localStorage ---
      useEffect(() => {
        localStorage.setItem('salma_clinic_settings', JSON.stringify(settings));
      }, [settings]);

      useEffect(() => {
        if (user) localStorage.setItem('salma_clinic_auth_user', JSON.stringify(user));
        else localStorage.removeItem('salma_clinic_auth_user');
      }, [user]);

      useEffect(() => {
        localStorage.setItem('salma_patients', JSON.stringify(patients));
      }, [patients]);

      useEffect(() => {
        localStorage.setItem('salma_appointments', JSON.stringify(appointments));
      }, [appointments]);

      useEffect(() => {
        localStorage.setItem('salma_prescriptions', JSON.stringify(prescriptions));
      }, [prescriptions]);

      useEffect(() => {
        localStorage.setItem('salma_invoices', JSON.stringify(invoices));
      }, [invoices]);

      useEffect(() => {
        localStorage.setItem('salma_doctors', JSON.stringify(doctors));
      }, [doctors]);

      // --- Dynamic WhatsApp Template Interpolation ---
      useEffect(() => {
        const p = patients.find(pt => pt.id === waPatientId) || patients[0];
        const t = WHATSAPP_TEMPLATES.find(tpl => tpl.id === waTplId) || WHATSAPP_TEMPLATES[0];
        const appt = appointments.find(a => a.patientId === p.id) || appointments[0];
        const rx = prescriptions.find(r => r.patientId === p.id) || prescriptions[0];
        const inv = invoices.find(i => i.patientId === p.id) || invoices[0];

        let txt = t.template;
        txt = txt.replace(/{clinic_name}/g, settings.name);
        txt = txt.replace(/{branch}/g, settings.branch);
        txt = txt.replace(/{phone}/g, settings.phone);
        txt = txt.replace(/{currency}/g, settings.currency);
        txt = txt.replace(/{patient_name}/g, p.name);
        txt = txt.replace(/{doctor_name}/g, appt ? appt.doctorName : 'د. سلمى الشمري');
        txt = txt.replace(/{date}/g, appt ? appt.date : '2026-09-04');
        txt = txt.replace(/{time}/g, appt ? appt.time : '18:30');
        txt = txt.replace(/{service_name}/g, appt ? appt.serviceName : 'كشف العيادة');
        txt = txt.replace(/{rx_id}/g, rx ? rx.id : 'RX-8801');
        txt = txt.replace(/{invoice_id}/g, inv ? inv.invoiceNumber : 'SALMA-2026-0901');
        txt = txt.replace(/{total_amount}/g, inv ? String(inv.totalWithVat) : '460');

        setWaMessage(txt);
        setWaPhone(p.phone);
      }, [waPatientId, waTplId, appointments, prescriptions, invoices, patients, settings]);

      // --- Theme CSS Palette Helpers ---
      const themeColors = useMemo(() => {
        switch (settings.theme) {
          case 'emerald':
            return {
              primary: 'emerald',
              bgGradient: 'from-emerald-700 via-teal-800 to-slate-900',
              btnPrimary: 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-emerald-600/20',
              btnAccent: 'bg-teal-500 hover:bg-teal-600 text-slate-950 font-bold',
              badge: 'bg-emerald-50 text-emerald-700 border-emerald-200',
              activeNav: 'bg-emerald-600 text-white shadow-md',
              iconBg: 'bg-emerald-500/10 text-emerald-600'
            };
          case 'indigo':
            return {
              primary: 'indigo',
              bgGradient: 'from-indigo-800 via-slate-900 to-blue-950',
              btnPrimary: 'bg-indigo-600 hover:bg-indigo-700 text-white shadow-indigo-600/20',
              btnAccent: 'bg-sky-400 hover:bg-sky-500 text-slate-950 font-bold',
              badge: 'bg-indigo-50 text-indigo-700 border-indigo-200',
              activeNav: 'bg-indigo-600 text-white shadow-md',
              iconBg: 'bg-indigo-500/10 text-indigo-600'
            };
          case 'teal':
            return {
              primary: 'teal',
              bgGradient: 'from-teal-800 via-cyan-900 to-slate-900',
              btnPrimary: 'bg-teal-600 hover:bg-teal-700 text-white shadow-teal-600/20',
              btnAccent: 'bg-cyan-400 hover:bg-cyan-500 text-slate-950 font-bold',
              badge: 'bg-teal-50 text-teal-700 border-teal-200',
              activeNav: 'bg-teal-600 text-white shadow-md',
              iconBg: 'bg-teal-500/10 text-teal-600'
            };
          case 'blue':
          default:
            return {
              primary: 'brand',
              bgGradient: 'from-blue-700 via-slate-900 to-sky-950',
              btnPrimary: 'bg-brand-600 hover:bg-brand-700 text-white shadow-brand-600/20',
              btnAccent: 'bg-sky-400 hover:bg-sky-500 text-slate-950 font-bold',
              badge: 'bg-blue-50 text-blue-700 border-blue-200',
              activeNav: 'bg-brand-600 text-white shadow-md',
              iconBg: 'bg-blue-500/10 text-brand-600'
            };
        }
      }, [settings.theme]);

      // --- Action Handlers ---
      const handlePatientLogin = (e) => {
        e.preventDefault();
        const found = patients.find(p => 
          (p.name.trim().toLowerCase() === inputPatientName.trim().toLowerCase() || p.name.includes(inputPatientName.trim())) && 
          p.nationalId.trim() === inputNationalId.trim()
        );
        if (found) {
          const pUser = { 
            id: found.id, 
            name: found.name, 
            role: 'patient', 
            nationalId: found.nationalId, 
            phone: found.phone, 
            avatar: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&q=80&w=200", 
            specialtyName: "مريض مسجل (" + found.id + ")" 
          };
          setUser(pUser);
          setSelectedPatient(found);
          setCurrentPath('/dashboard/patient');
        } else {
          alert('بيانات المريض غير متطابقة. يرجى تجربة سارة عبد الله الشمري / 1092837461 أو استخدام أحد الحسابات التجريبية بالأسفل.');
        }
      };

      const handleStaffLogin = (e) => {
        e.preventDefault();
        const found = INITIAL_USERS.find(u => u.email.toLowerCase() === inputEmail.trim().toLowerCase());
        if (found) {
          setUser(found);
          if (found.role === 'doctor') setCurrentPath('/dashboard/doctor');
          else if (found.role === 'receptionist') setCurrentPath('/dashboard/reception');
          else if (found.role === 'finance') setCurrentPath('/dashboard/finance');
          else if (found.role === 'owner') setCurrentPath('/dashboard/owner');
        } else {
          alert('بيانات الدخول غير صحيحة. يرجى استخدام الحسابات التجريبية الموضحة.');
        }
      };

      const handleDemoLogin = (roleKey) => {
        if (roleKey === 'patient') {
          const p = patients[0] || INITIAL_PATIENTS[0];
          const pUser = { 
            id: p.id, 
            name: p.name, 
            role: 'patient', 
            nationalId: p.nationalId, 
            phone: p.phone, 
            avatar: "https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&q=80&w=200", 
            specialtyName: "مريض مسجل (" + p.id + ")" 
          };
          setUser(pUser);
          setSelectedPatient(p);
          setCurrentPath('/dashboard/patient');
          return;
        }

        const target = INITIAL_USERS.find(u => u.role === roleKey) || INITIAL_USERS[0];
        setUser(target);
        if (roleKey === 'doctor') setCurrentPath('/dashboard/doctor');
        else if (roleKey === 'receptionist') setCurrentPath('/dashboard/reception');
        else if (roleKey === 'finance') setCurrentPath('/dashboard/finance');
        else if (roleKey === 'owner') setCurrentPath('/dashboard/owner');
      };

      // --- White-Label SaaS Settings Handlers ---
      const handleSaveSettings = (e) => {
        e.preventDefault();
        setSettings(settingsForm);
        alert('تم حفظ إعدادات وهوية المركز بنجاح! تم تطبيق التغييرات فورياً في كافة أرجاء النظام.');
      };

      const handleResetSettings = () => {
        if (window.confirm('هل أنت متأكد من استعادة الإعدادات الافتراضية للنظام؟')) {
          setSettings(DEFAULT_SETTINGS);
          setSettingsForm(DEFAULT_SETTINGS);
          localStorage.removeItem('salma_clinic_settings');
          alert('تمت استعادة الإعدادات الافتراضية.');
        }
      };

      // --- Odontogram FDI 32 Tooth Handler ---
      const handleSaveToothCondition = (e) => {
        e.preventDefault();
        if (!selectedTooth) return;
        const conditionObj = TOOTH_CONDITIONS[toothCondition] || TOOTH_CONDITIONS['composite-filling'];
        
        const newRecord = {
          toothNumber: selectedTooth,
          condition: toothCondition,
          conditionLabel: conditionObj.label.split(' ')[0],
          surface: toothSurface,
          date: new Date().toISOString().split('T')[0],
          doctor: user?.name || 'د. فهد العنزي',
          notes: toothNotes || 'إجراء علاجي مسجل في مخطط الأسنان'
        };

        const currentRecords = selectedPatient.dentalRecords || [];
        const existingIdx = currentRecords.findIndex(r => r.toothNumber === selectedTooth);
        let updatedRecords;
        if (existingIdx >= 0) {
          updatedRecords = [...currentRecords];
          updatedRecords[existingIdx] = newRecord;
        } else {
          updatedRecords = [newRecord, ...currentRecords];
        }

        const updatedPatient = { ...selectedPatient, dentalRecords: updatedRecords };
        setSelectedPatient(updatedPatient);
        setPatients(patients.map(p => p.id === updatedPatient.id ? updatedPatient : p));
        alert('تم بنجاح تحديث تشخيص السن #' + selectedTooth + ' في ملف المريض ' + selectedPatient.name);
        setSelectedTooth(null);
        setToothNotes('');
      };

      // --- Dermatology Session Logger ---
      const handleAddDermaSession = (e) => {
        e.preventDefault();
        const newSession = {
          date: new Date().toISOString().split('T')[0],
          doctor: user?.name || 'د. سلمى الشمري',
          device: dermaDevice,
          treatment: dermaTreatment,
          fluence: dermaFluence,
          pulseWidth: dermaPulse,
          spotSize: dermaSpot,
          treatedAreas: [dermaAreas],
          notes: dermaNotes || 'جلسة معالجة مع التوصيات'
        };

        const updatedPatient = {
          ...selectedPatient,
          dermatologyRecords: [newSession, ...(selectedPatient.dermatologyRecords || [])]
        };

        setSelectedPatient(updatedPatient);
        setPatients(patients.map(p => p.id === updatedPatient.id ? updatedPatient : p));
        setShowDermaModal(false);
        setDermaNotes('');
        alert('تم تسجيل جلسة الليزر والتجميل بنجاح في سجل المريض!');
      };

      // --- Appointment Handlers ---
      const handleSaveSlot = (e) => {
        e.preventDefault();
        const p = patients.find(pt => pt.id === slotPatientId) || patients[0];
        const newAppt = {
          id: "APT-2026-" + String(appointments.length + 1).padStart(3, '0'),
          patientId: p.id,
          patientName: p.name,
          phone: p.phone,
          doctorId: slotSpecialty === 'dental' ? 'u-doc-2' : 'u-doc-1',
          doctorName: slotDoctor,
          specialty: slotSpecialty,
          serviceName: slotService,
          date: slotDate,
          time: slotTime,
          status: 'waiting',
          statusLabel: 'في صالة الانتظار',
          price: Number(slotPrice)
        };
        setAppointments([newAppt, ...appointments]);
        setShowSlotModal(false);
        alert('تم تسجيل وصول وحجز موعد ' + p.name + ' بنجاح وإدراجه في طابور الانتظار!');
      };

      const handleCancelAppt = (id) => {
        if (window.confirm('هل أنت متأكد من رغبتك في إلغاء هذا الموعد؟')) {
          setAppointments(appointments.map(a => a.id === id ? { ...a, status: 'cancelled', statusLabel: 'ملغي' } : a));
        }
      };

      const handleUpdateDoctorCommission = (docId) => {
        setDoctors(doctors.map(d => d.id === docId ? { ...d, commissionRate: Number(tempRate) } : d));
        setEditingDocId(null);
        alert('تم تحديث نسبة عمولة الطبيب بنجاح.');
      };

      // --- WhatsApp Webhook & API Sender ---
      const handleSendWhatsAppWebhook = async () => {
        const cleanPhone = waPhone.replace(/[^0-9]/g, '');
        const formattedPhone = cleanPhone.startsWith('05') ? '966' + cleanPhone.substring(1) : cleanPhone.startsWith('5') ? '966' + cleanPhone : cleanPhone;

        const payload = {
          chatId: formattedPhone + "@c.us",
          text: waMessage,
          session: "default",
          metadata: {
            clinic: settings.name,
            patientId: waPatientId,
            timestamp: new Date().toISOString()
          }
        };

        const newLog = {
          id: 'WA-' + Date.now(),
          time: new Date().toLocaleTimeString('ar-SA'),
          phone: formattedPhone,
          status: 'sent',
          payload
        };

        setWaStatusLog([newLog, ...waStatusLog]);

        // Trigger native WhatsApp link
        const waUrl = "https://wa.me/" + formattedPhone + "?text=" + encodeURIComponent(waMessage);
        window.open(waUrl, '_blank');
      };

      // --- Financial & Analytics Calculations ---
      const totalClinicGross = invoices.reduce((s, i) => s + i.subtotal, 0);
      const totalClinicVat = invoices.reduce((s, i) => s + i.vatAmount, 0);
      const totalClinicWithVat = invoices.reduce((s, i) => s + i.totalWithVat, 0);

      const paymentBreakdown = useMemo(() => {
        const mada = invoices.filter(i => i.paymentMethod === 'mada').reduce((s, i) => s + i.totalWithVat, 0);
        const apple = invoices.filter(i => i.paymentMethod === 'applepay').reduce((s, i) => s + i.totalWithVat, 0);
        const cash = invoices.filter(i => i.paymentMethod === 'cash').reduce((s, i) => s + i.totalWithVat, 0);
        const total = totalClinicWithVat || 1;
        return {
          mada: { amount: mada, pct: Math.round((mada / total) * 100) },
          apple: { amount: apple, pct: Math.round((apple / total) * 100) },
          cash: { amount: cash, pct: Math.round((cash / total) * 100) }
        };
      }, [invoices, totalClinicWithVat]);

      const doctorStats = useMemo(() => {
        return doctors.map(doc => {
          const docInvs = invoices.filter(inv => inv.doctorName === doc.name || inv.doctorId === doc.id);
          const gross = docInvs.reduce((s, i) => s + i.subtotal, 0);
          const commRate = doc.commissionRate || 30;
          const commAmt = parseFloat(((gross * commRate) / 100).toFixed(2));
          const base = doc.baseSalary || 15000;
          const payout = parseFloat((base + commAmt).toFixed(2));
          const clinicNet = parseFloat((gross - commAmt).toFixed(2));
          return { ...doc, gross, commAmt, payout, clinicNet, count: docInvs.length };
        });
      }, [doctors, invoices]);

      const totalDoctorComms = doctorStats.reduce((s, d) => s + d.commAmt, 0);
      const totalClinicNetProfit = Math.max(0, totalClinicGross - totalDoctorComms);

      const timeSlots = ['09:00', '10:00', '11:00', '12:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00'];
      const weekDays = [
        { label: 'السبت', date: '2026-09-04' },
        { label: 'الأحد', date: '2026-09-05' },
        { label: 'الاثنين', date: '2026-09-06' },
        { label: 'الثلاثاء', date: '2026-09-07' },
        { label: 'الأربعاء', date: '2026-09-08' }
      ];

      // --- VIEW: Unauthenticated / Login Screen ---
      if (currentPath === '/login' || !user) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-blue-950 to-slate-900 flex flex-col justify-center py-10 px-4 text-right relative overflow-hidden" dir="rtl">
            <div className="absolute -top-32 -right-32 w-96 h-96 bg-brand-500/15 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute -bottom-32 -left-32 w-96 h-96 bg-sky-500/15 rounded-full blur-3xl pointer-events-none"></div>

            <div className="max-w-xl mx-auto w-full text-center relative z-10">
              <div className="inline-flex p-4 bg-gradient-to-tr from-brand-600 to-sky-400 rounded-3xl text-white text-3xl mb-4 shadow-xl shadow-brand-500/20 ring-4 ring-white/10">
                🦷
              </div>
              <h1 className="text-2xl sm:text-3xl font-black text-white tracking-tight">
                {settings.name}
              </h1>
              <p className="text-sky-300 text-xs sm:text-sm font-semibold mt-1">
                {settings.nameEn} • {settings.branch}
              </p>
              <p className="text-slate-400 text-xs mt-1">
                بوابة المرضى والإدارة الطبية الذكية الموحدة (SaaS Multi-Role Portal)
              </p>
            </div>

            <div className="mt-6 max-w-xl mx-auto w-full bg-slate-800/90 backdrop-blur-xl border border-slate-700/80 p-6 sm:p-8 rounded-3xl shadow-2xl relative z-10">
              
              {/* Tab Selector */}
              <div className="flex bg-slate-900/90 p-1.5 rounded-2xl border border-slate-700/80 mb-6">
                <button
                  type="button"
                  onClick={() => setLoginTab('patient')}
                  className={"flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 " + (loginTab === 'patient' ? 'bg-gradient-to-r from-brand-600 to-sky-600 text-white shadow-lg' : 'text-slate-400 hover:text-white')}
                >
                  <span>👤 بوابة المرضى (الاسم + الهوية)</span>
                </button>
                <button
                  type="button"
                  onClick={() => setLoginTab('staff')}
                  className={"flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition flex items-center justify-center gap-2 " + (loginTab === 'staff' ? 'bg-gradient-to-r from-brand-600 to-sky-600 text-white shadow-lg' : 'text-slate-400 hover:text-white')}
                >
                  <span>🔑 دخول الكادر الطبي والإداري</span>
                </button>
              </div>

              {loginTab === 'patient' ? (
                <form onSubmit={handlePatientLogin} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 font-bold mb-1.5">اسم المريض المسجل (Patient Name)</label>
                    <input
                      type="text"
                      value={inputPatientName}
                      onChange={e => setInputPatientName(e.target.value)}
                      placeholder="مثال: سارة عبد الله الشمري"
                      className="w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white text-xs sm:text-sm font-bold placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-bold mb-1.5">رقم الهوية الوطنية / الإقامة (National ID as Password)</label>
                    <input
                      type="password"
                      dir="ltr"
                      value={inputNationalId}
                      onChange={e => setInputNationalId(e.target.value)}
                      placeholder="10XXXXXXXX"
                      className="w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white text-xs sm:text-sm font-mono font-bold placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500"
                    />
                    <p className="text-[11px] text-slate-400 mt-1">💡 استخدم اسمك المسجل ورقم الهوية المكون من 10 أرقام للدخول الفوري.</p>
                  </div>
                  <button
                    type="submit"
                    className="w-full py-3.5 bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-500 hover:to-sky-400 text-white font-black rounded-xl text-xs sm:text-sm shadow-lg shadow-brand-600/30 transition duration-150"
                  >
                    دخول إلى بوابة المريض الإلكترونية 🌸
                  </button>
                </form>
              ) : (
                <form onSubmit={handleStaffLogin} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 font-bold mb-1.5">البريد الإلكتروني المهني (Staff Email)</label>
                    <input
                      type="email"
                      dir="ltr"
                      value={inputEmail}
                      onChange={e => setInputEmail(e.target.value)}
                      placeholder="doctor@salmaclinic.sa / owner@salmaclinic.sa"
                      className="w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white text-xs sm:text-sm font-mono placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-bold mb-1.5">كلمة المرور (Password)</label>
                    <input
                      type="password"
                      dir="ltr"
                      value={inputPassword}
                      onChange={e => setInputPassword(e.target.value)}
                      placeholder="••••••••"
                      className="w-full p-3 bg-slate-900/80 border border-slate-700 rounded-xl text-white text-xs sm:text-sm font-mono placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-brand-500"
                    />
                  </div>
                  <button
                    type="submit"
                    className="w-full py-3.5 bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-500 hover:to-sky-400 text-white font-black rounded-xl text-xs sm:text-sm shadow-lg shadow-brand-600/30 transition duration-150"
                  >
                    تسجيل دخول الكادر إلى المنظومة 🚀
                  </button>
                </form>
              )}

              {/* 5 One-Click Demo Credentials */}
              <div className="mt-8 pt-6 border-t border-slate-700/60">
                <div className="flex items-center justify-between mb-3">
                  <span className="text-xs font-bold text-slate-300">حسابات تجريبية جاهزة بنقرة واحدة (5 Demo Roles):</span>
                  <span className="text-[10px] bg-brand-500/20 text-sky-300 px-2.5 py-0.5 rounded-full font-bold">جاهز للاختبار</span>
                </div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                  {DEMO_CREDENTIALS.map(d => (
                    <button
                      key={d.role}
                      type="button"
                      onClick={() => handleDemoLogin(d.role)}
                      className="p-3 rounded-2xl bg-slate-900/90 hover:bg-brand-950/60 border border-slate-700/80 hover:border-brand-500 text-right transition group"
                    >
                      <div className="text-xs font-black text-white group-hover:text-sky-300 transition">{d.label}</div>
                      <div className="text-[11px] text-slate-400 mt-0.5">{d.name}</div>
                      <div className="text-[9px] font-mono text-sky-400 mt-1" dir="ltr">{d.route}</div>
                    </button>
                  ))}
                </div>
              </div>

            </div>
          </div>
        );
      }

      // --- MAIN AUTHENTICATED APP LAYOUT ---
      return (
        <div className="min-h-screen flex flex-col bg-[#f8fafc] font-sans antialiased text-slate-800" dir="rtl">
          
          {/* Top Sticky Header */}
          <header className="bg-white border-b border-slate-200/80 sticky top-0 z-30 shadow-sm shadow-slate-100">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* Brand Logo & Name */}
              <div
                className="flex items-center gap-3 cursor-pointer group"
                onClick={() => {
                  if (user.role === 'patient') setCurrentPath('/dashboard/patient');
                  else if (user.role === 'doctor') setCurrentPath('/dashboard/doctor');
                  else if (user.role === 'receptionist') setCurrentPath('/dashboard/reception');
                  else if (user.role === 'finance') setCurrentPath('/dashboard/finance');
                  else if (user.role === 'owner') setCurrentPath('/dashboard/owner');
                }}
              >
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-sky-500 text-white flex items-center justify-center text-xl font-black shadow-md shadow-brand-500/20 group-hover:scale-105 transition">
                  🦷
                </div>
                <div>
                  <h1 className="text-sm sm:text-base font-black text-slate-900 leading-tight group-hover:text-brand-600 transition">
                    {settings.name}
                  </h1>
                  <p className="text-[11px] text-slate-500 font-medium">
                    {settings.branch}
                  </p>
                </div>
              </div>

              {/* Top Navigation Switchers & User Profile */}
              <div className="flex items-center gap-2 sm:gap-4">
                
                {/* 5 Demo Roles Quick Pills */}
                <div className="hidden xl:flex bg-slate-100 p-1 rounded-2xl border border-slate-200/60">
                  {DEMO_CREDENTIALS.map(d => (
                    <button
                      key={d.role}
                      type="button"
                      onClick={() => handleDemoLogin(d.role)}
                      className={"px-2.5 py-1 rounded-xl text-xs font-bold transition " + (user.role === d.role ? 'bg-white text-slate-900 shadow-sm border border-slate-200/50' : 'text-slate-500 hover:text-slate-900')}
                    >
                      {d.role === 'patient' ? 'مريض' : d.role === 'doctor' ? 'طبيب' : d.role === 'receptionist' ? 'استقبال' : d.role === 'finance' ? 'مالية' : 'مالك المركز'}
                    </button>
                  ))}
                </div>

                {/* Settings Shortcut Button (Owner only) */}
                {user.role === 'owner' && (
                  <button
                    onClick={() => setCurrentPath('/settings')}
                    className={"p-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border " + (currentPath === '/settings' ? 'bg-brand-50 text-brand-700 border-brand-300' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100')}
                    title="إعدادات وهوية المركز"
                  >
                    <span>⚙️</span>
                    <span className="hidden sm:inline">إعدادات وهوية المركز</span>
                  </button>
                )}

                {/* Logged in User Tag & Logout */}
                <div className="flex items-center gap-2.5 pr-2 border-r border-slate-200">
                  <div className="hidden md:block text-left text-xs font-bold text-slate-900">
                    <div>{user.name}</div>
                    <div className="text-[10px] text-slate-500">{user.specialtyName}</div>
                  </div>
                  
                  <img
                    src={user.avatar || "https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&q=80&w=200"}
                    alt={user.name}
                    className="w-9 h-9 rounded-xl object-cover ring-2 ring-slate-200"
                  />

                  <button
                    onClick={() => { setUser(null); setCurrentPath('/login'); }}
                    className="p-2 text-xs text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-xl font-bold transition"
                    title="تسجيل الخروج"
                  >
                    خروج
                  </button>
                </div>

              </div>

            </div>
          </header>

          {/* Main Content Layout with Sidebar */}
          <div className="flex-1 max-w-7xl w-full mx-auto flex">
            
            {/* Sidebar Navigation */}
            <aside className="w-60 bg-white border-l border-slate-200/80 p-4 shrink-0 hidden lg:flex flex-col justify-between sidebar-container shadow-sm">
              <div className="space-y-6">
                
                {/* Clinic Badge */}
                <div className="p-3 bg-brand-50/60 rounded-2xl border border-brand-100 text-xs">
                  <div className="text-brand-900 font-extrabold flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                    <span>{settings.nameEn}</span>
                  </div>
                  <div className="text-[10px] text-brand-700 mt-0.5">ضريبة 15% ZATCA متوافقة</div>
                </div>

                {/* Dashboards Section */}
                <div className="space-y-1">
                  <div className="px-2 text-[10px] font-black text-slate-400 uppercase tracking-wider mb-2">لوحات التحكم</div>
                  
                  {user.role === 'patient' && (
                    <button
                      onClick={() => setCurrentPath('/dashboard/patient')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/dashboard/patient' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>👤</span>
                      <span>بوابة المريض وسجلي</span>
                    </button>
                  )}

                  {user.role === 'doctor' && (
                    <button
                      onClick={() => setCurrentPath('/dashboard/doctor')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/dashboard/doctor' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>🩺</span>
                      <span>كشف الطبيب ومخطط الأسنان</span>
                    </button>
                  )}

                  {['receptionist', 'doctor', 'finance', 'owner'].includes(user.role) && (
                    <button
                      onClick={() => setCurrentPath('/dashboard/reception')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/dashboard/reception' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>📅</span>
                      <span>كاونتر الاستقبال والانتظار</span>
                    </button>
                  )}

                  {['finance', 'owner'].includes(user.role) && (
                    <button
                      onClick={() => setCurrentPath('/dashboard/finance')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/dashboard/finance' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>💼</span>
                      <span>التقارير المالية والضريبة</span>
                    </button>
                  )}

                  {user.role === 'owner' && (
                    <button
                      onClick={() => setCurrentPath('/dashboard/owner')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/dashboard/owner' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>👑</span>
                      <span>مالك المركز وعمولات الأطباء</span>
                    </button>
                  )}
                </div>

                {/* Operations Section */}
                <div className="space-y-1">
                  <div className="px-2 text-[10px] font-black text-slate-400 uppercase tracking-wider mb-2">الخدمات الطبية والتقويم</div>
                  
                  <button
                    onClick={() => setCurrentPath('/appointments')}
                    className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/appointments' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                  >
                    <span>🗓</span>
                    <span>التقويم التفاعلي (Click-to-Add)</span>
                  </button>

                  {user.role !== 'patient' && (
                    <button
                      onClick={() => setCurrentPath('/patients')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/patients' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>👥</span>
                      <span>سجل المرضى ومخطط الأسنان</span>
                    </button>
                  )}

                  <button
                    onClick={() => setCurrentPath('/prescriptions')}
                    className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/prescriptions' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                  >
                    <span>📄</span>
                    <span>الروشتات والوصفات الطبية</span>
                  </button>

                  <button
                    onClick={() => setCurrentPath('/invoices')}
                    className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/invoices' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                  >
                    <span>🧾</span>
                    <span>الفواتير 15% ZATCA QR</span>
                  </button>

                  {user.role !== 'patient' && (
                    <button
                      onClick={() => setCurrentPath('/whatsapp-notifications')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/whatsapp-notifications' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>💬</span>
                      <span>إشعارات الواتساب التلقائية</span>
                    </button>
                  )}

                  {user.role === 'owner' && (
                    <button
                      onClick={() => setCurrentPath('/settings')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/settings' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>⚙️</span>
                      <span>إعدادات وهوية المركز (SaaS)</span>
                    </button>
                  )}
                </div>

              </div>

              {/* Sidebar Footer */}
              <div className="pt-4 border-t border-slate-100 text-right">
                <div className="text-[11px] font-bold text-slate-700">{settings.name}</div>
                <div className="text-[10px] text-slate-400 font-mono" dir="ltr">{settings.phone}</div>
              </div>
            </aside>

            {/* Main Dynamic Viewport Container */}
            <main className="flex-1 p-4 sm:p-6 lg:p-8 min-w-0 overflow-y-auto">

              {/* 1. PATIENT DASHBOARD */}
              {currentPath === '/dashboard/patient' && (
                <div className="space-y-6">
                  <div className={"bg-gradient-to-l " + themeColors.bgGradient + " rounded-3xl p-6 sm:p-8 text-white shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4"}>
                    <div className="space-y-2">
                      <span className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/15 text-white text-xs font-bold backdrop-blur-md">
                        <span>🌸</span>
                        <span>بوابة المريض الإلكترونية الموحدة</span>
                      </span>
                      <h2 className="text-2xl sm:text-3xl font-black">مرحباً بك، {selectedPatient.name} 👋</h2>
                      <div className="flex flex-wrap items-center gap-3 text-xs text-sky-200">
                        <span>رقم الملف: <strong className="font-mono text-white">{selectedPatient.id}</strong></span>
                        <span>•</span>
                        <span>الهوية: <strong className="font-mono text-white">{selectedPatient.nationalId}</strong></span>
                        <span>•</span>
                        <span>فصيلة الدم: <strong className="text-rose-300 font-bold">{selectedPatient.bloodGroup}</strong></span>
                      </div>
                    </div>
                    <button
                      onClick={() => { setSlotDate('2026-09-05'); setSlotTime('19:00'); setShowSlotModal(true); }}
                      className="px-5 py-3 bg-white hover:bg-sky-50 text-slate-900 font-black text-xs rounded-2xl shadow-lg transition"
                    >
                      + حجز موعد جديد بالمركز
                    </button>
                  </div>

                  <div className="flex bg-white p-1.5 rounded-2xl border border-slate-200/80 shadow-sm gap-1 overflow-x-auto text-xs font-bold">
                    <button onClick={() => setPatientTab('appointments')} className={"flex-1 min-w-[110px] py-2.5 rounded-xl transition " + (patientTab === 'appointments' ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100')}>
                      📅 مواعيدي ({appointments.filter(a => a.patientId === selectedPatient.id).length})
                    </button>
                    <button onClick={() => setPatientTab('odontogram')} className={"flex-1 min-w-[130px] py-2.5 rounded-xl transition " + (patientTab === 'odontogram' ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100')}>
                      🦷 مخطط الأسنان ({selectedPatient.dentalRecords?.length || 0})
                    </button>
                    <button onClick={() => setPatientTab('derma')} className={"flex-1 min-w-[130px] py-2.5 rounded-xl transition " + (patientTab === 'derma' ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100')}>
                      ✨ جلسات الجلدية ({selectedPatient.dermatologyRecords?.length || 0})
                    </button>
                    <button onClick={() => setPatientTab('prescriptions')} className={"flex-1 min-w-[110px] py-2.5 rounded-xl transition " + (patientTab === 'prescriptions' ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100')}>
                      📄 الروشتات ({prescriptions.filter(r => r.patientId === selectedPatient.id).length})
                    </button>
                    <button onClick={() => setPatientTab('invoices')} className={"flex-1 min-w-[120px] py-2.5 rounded-xl transition " + (patientTab === 'invoices' ? 'bg-brand-600 text-white shadow-sm' : 'text-slate-600 hover:bg-slate-100')}>
                      🧾 الفواتير الضريبية ({invoices.filter(i => i.patientId === selectedPatient.id).length})
                    </button>
                  </div>

                  {patientTab === 'appointments' && (
                    <div className="space-y-4">
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {appointments.filter(a => a.patientId === selectedPatient.id).map(a => (
                          <div key={a.id} className="bg-white p-5 rounded-3xl border border-slate-200/80 shadow-sm space-y-3 flex flex-col justify-between">
                            <div>
                              <div className="flex justify-between items-center mb-2">
                                <span className={"text-[10px] font-bold px-2.5 py-1 rounded-full border " + (a.specialty === 'dental' ? 'bg-blue-50 text-blue-800 border-blue-200' : 'bg-teal-50 text-teal-800 border-teal-200')}>
                                  {a.specialty === 'dental' ? '🦷 عيادة الأسنان' : '✨ عيادة الجلدية'}
                                </span>
                                <span className="text-[10px] bg-emerald-50 text-emerald-800 font-bold px-2.5 py-1 rounded-full">{a.statusLabel}</span>
                              </div>
                              <h4 className="text-sm font-black text-slate-900">{a.serviceName}</h4>
                              <div className="text-xs text-slate-600 mt-1">الطبيب: <strong className="text-slate-900">{a.doctorName}</strong></div>
                              <div className="text-xs text-slate-500 font-mono mt-1">📅 {a.date} • ⏰ {a.time}</div>
                            </div>
                            <div className="pt-3 border-t border-slate-100 flex justify-between items-center">
                              <span className="text-xs font-bold text-brand-700">{a.price} {settings.currency}</span>
                              {a.status === 'scheduled' && (
                                <button onClick={() => handleCancelAppt(a.id)} className="text-xs text-rose-600 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-xl font-bold transition border border-rose-200">
                                  إلغاء الموعد
                                </button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {patientTab === 'odontogram' && (
                    <div className="bg-white rounded-3xl border border-slate-200/80 p-6 shadow-sm space-y-6">
                      <div className="border-b border-slate-100 pb-3">
                        <h3 className="text-sm font-black text-slate-900">🦷 مخطط الأسنان السريري للمريض (FDI ISO 3950)</h3>
                        <p className="text-xs text-slate-500">سجل تشخيصات وحشوات الأسنان</p>
                      </div>
                      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {QUADRANTS.map(q => (
                          <div key={q.name} className="p-4 bg-slate-50 rounded-2xl border border-slate-200/60">
                            <div className="text-xs font-bold text-slate-700 mb-2">{q.name}</div>
                            <div className="grid grid-cols-4 sm:grid-cols-8 gap-1.5">
                              {q.teeth.map(tNum => {
                                const rec = (selectedPatient.dentalRecords || []).find(r => r.toothNumber === tNum);
                                const condObj = rec ? TOOTH_CONDITIONS[rec.condition] : TOOTH_CONDITIONS['sound'];
                                return (
                                  <div key={tNum} className={"p-2 rounded-xl border text-center flex flex-col justify-center items-center min-h-[50px] shadow-sm " + (condObj ? condObj.color : 'bg-white')}>
                                    <span className="font-mono font-black text-xs">#{tNum}</span>
                                    <span className="text-[8px] font-bold truncate max-w-[40px]">{rec ? rec.conditionLabel : 'سليم'}</span>
                                  </div>
                                );
                              })}
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {patientTab === 'derma' && (
                    <div className="bg-white rounded-3xl border border-slate-200/80 p-6 shadow-sm space-y-4">
                      <h3 className="text-sm font-black text-slate-900">✨ سجل جلسات الجلدية والليزر ومعايير الأجهزة</h3>
                      <div className="space-y-3">
                        {selectedPatient.dermatologyRecords?.map((s, i) => (
                          <div key={i} className="p-4 rounded-2xl bg-teal-50/50 border border-teal-100 text-xs space-y-2">
                            <div className="flex justify-between items-start font-black text-teal-950">
                              <div>{s.treatment} ({s.device})</div>
                              <span className="font-mono bg-white px-2 py-0.5 rounded border">{s.date}</span>
                            </div>
                            <div className="grid grid-cols-3 gap-2 text-[11px] pt-1 border-t border-teal-100">
                              <div>الطاقة: <strong>{s.fluence}</strong></div>
                              <div>النبضة: <strong>{s.pulseWidth}</strong></div>
                              <div>البقعة: <strong>{s.spotSize}</strong></div>
                            </div>
                            <div className="text-slate-600">المناطق: {s.treatedAreas?.join(', ')} | {s.notes}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {patientTab === 'prescriptions' && (
                    <div className="space-y-3">
                      {prescriptions.filter(r => r.patientId === selectedPatient.id).map(rx => (
                        <div key={rx.id} className="p-5 rounded-3xl bg-white border shadow-sm space-y-3">
                          <div className="flex justify-between items-center border-b pb-2">
                            <div><div className="font-black text-sm">{rx.diagnosis}</div><div className="text-xs text-slate-500">{rx.doctorName}</div></div>
                            <span className="font-mono font-bold text-xs text-brand-700">{rx.id} ({rx.date})</span>
                          </div>
                          <div className="space-y-1 text-xs">
                            {rx.items.map((it, idx) => (
                              <div key={idx} className="p-2 bg-brand-50/50 rounded-xl flex justify-between">
                                <span className="font-bold">{it.drugName} - {it.dosage}</span>
                                <span>{it.frequency} ({it.duration})</span>
                              </div>
                            ))}
                          </div>

                          value={settingsForm.branch}
                          onChange={e => setSettingsForm({ ...settingsForm, branch: e.target.value })}
                          className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl font-bold shadow-inner focus:outline-none focus:ring-2 focus:ring-brand-500"
                        />
                      </div>
                      <div className="space-y-1.5">
                        <label className="block font-bold text-slate-700">رقم هاتف المركز:</label>
                        <input
                          type="text"
                          value={settingsForm.phone}
                          onChange={e => setSettingsForm({ ...settingsForm, phone: e.target.value })}
                          className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl font-bold shadow-inner focus:outline-none focus:ring-2 focus:ring-brand-500"
                          dir="ltr"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-5 pt-4 border-t border-slate-100">
                      <div className="space-y-1.5">
                        <label className="block font-bold text-slate-700">الرقم الضريبي (ZATCA VAT):</label>
                        <input
                          type="text"
                          value={settingsForm.taxNumber}
                          onChange={e => setSettingsForm({ ...settingsForm, taxNumber: e.target.value })}
                          className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl font-mono font-bold shadow-inner focus:outline-none focus:ring-2 focus:ring-brand-500"
                          dir="ltr"
                        />
                      </div>
                      <div className="space-y-1.5">
                        <label className="block font-bold text-slate-700">نسبة الضريبة (%):</label>
                        <input
                          type="number"
                          value={settingsForm.vatRate}
                          onChange={e => setSettingsForm({ ...settingsForm, vatRate: Number(e.target.value) })}
                          className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl font-mono font-bold shadow-inner focus:outline-none focus:ring-2 focus:ring-brand-500"
                        />
                      </div>
                      <div className="space-y-1.5">
                        <label className="block font-bold text-slate-700">رمز العملة:</label>
                        <input
                          type="text"
                          value={settingsForm.currency}
                          onChange={e => setSettingsForm({ ...settingsForm, currency: e.target.value })}
                          className="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl font-bold shadow-inner focus:outline-none focus:ring-2 focus:ring-brand-500"
                        />
                      </div>
                    </div>

                    {/* Theme Radios */}
                    <div className="space-y-3 pt-4 border-t border-slate-100">
                      <label className="block font-bold text-slate-700">مظهر وثيم النظام (UI Theme Mode):</label>
                      <div className="grid grid-cols-1 sm:grid-cols-4 gap-3">
                        <label className={"p-4 rounded-2xl border-2 cursor-pointer flex flex-col justify-between transition " + (settingsForm.theme === 'blue' ? 'border-brand-600 bg-blue-50/50 shadow-sm' : 'border-slate-200 bg-white hover:bg-slate-50')}>
                          <input type="radio" name="theme" value="blue" checked={settingsForm.theme === 'blue'} onChange={() => setSettingsForm({ ...settingsForm, theme: 'blue' })} className="hidden" />
                          <div className="font-bold text-blue-900 text-xs flex items-center gap-2">
                            <span className="w-4 h-4 rounded-full bg-blue-600"></span>
                            <span>الأزرق الطبي (Clean Blue)</span>
                          </div>
                          <p className="text-[10px] text-slate-500 mt-2">تصميم عصري ونقي بمدرجات الياقوت والسماء</p>
                        </label>
                        <label className={"p-4 rounded-2xl border-2 cursor-pointer flex flex-col justify-between transition " + (settingsForm.theme === 'emerald' ? 'border-emerald-600 bg-emerald-50/50 shadow-sm' : 'border-slate-200 bg-white hover:bg-slate-50')}>
                          <input type="radio" name="theme" value="emerald" checked={settingsForm.theme === 'emerald'} onChange={() => setSettingsForm({ ...settingsForm, theme: 'emerald' })} className="hidden" />
                          <div className="font-bold text-emerald-900 text-xs flex items-center gap-2">
                            <span className="w-4 h-4 rounded-full bg-emerald-600"></span>
                            <span>الزمردي والنعناع (Emerald)</span>
                          </div>
                          <p className="text-[10px] text-slate-500 mt-2">ثيم العيادات الكلاسيكية والألوان الطبيعية</p>
                        </label>
                        <label className={"p-4 rounded-2xl border-2 cursor-pointer flex flex-col justify-between transition " + (settingsForm.theme === 'indigo' ? 'border-indigo-600 bg-indigo-50/50 shadow-sm' : 'border-slate-200 bg-white hover:bg-slate-50')}>
                          <input type="radio" name="theme" value="indigo" checked={settingsForm.theme === 'indigo'} onChange={() => setSettingsForm({ ...settingsForm, theme: 'indigo' })} className="hidden" />
                          <div className="font-bold text-indigo-900 text-xs flex items-center gap-2">
                            <span className="w-4 h-4 rounded-full bg-indigo-600"></span>
                            <span>الليلكي والياقوت (Indigo)</span>
                          </div>
                          <p className="text-[10px] text-slate-500 mt-2">ثيم مراكز التجميل والجلدية الراقية</p>
                        </label>
                        <label className={"p-4 rounded-2xl border-2 cursor-pointer flex flex-col justify-between transition " + (settingsForm.theme === 'teal' ? 'border-teal-600 bg-teal-50/50 shadow-sm' : 'border-slate-200 bg-white hover:bg-slate-50')}>
                          <input type="radio" name="theme" value="teal" checked={settingsForm.theme === 'teal'} onChange={() => setSettingsForm({ ...settingsForm, theme: 'teal' })} className="hidden" />
                          <div className="font-bold text-teal-900 text-xs flex items-center gap-2">
                            <span className="w-4 h-4 rounded-full bg-teal-600"></span>
                            <span>التركواز السريري (Teal)</span>
                          </div>
                          <p className="text-[10px] text-slate-500 mt-2">مزيج حيوي بين الأخضر والأزرق الطبي</p>
                        </label>
                      </div>
                    </div>

                    <div className="pt-6 border-t border-slate-100 flex flex-col sm:flex-row justify-between items-center gap-3">
                      <button type="button" onClick={handleResetSettings} className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition text-xs">
                        استعادة الإعدادات الافتراضية 🔄
                      </button>
                      <button type="submit" className="px-8 py-3 bg-brand-600 hover:bg-brand-700 text-white font-black rounded-2xl shadow-lg shadow-brand-600/20 text-xs sm:text-sm transition">
                        حفظ وتطبيق إعدادات وهوية المركز فورياً 🚀
                      </button>
                    </div>
                  </form>
                </div>
              )}

            </main>
          </div>

          {/* Quick Appointment Modal */}
          {showSlotModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 text-xs shadow-2xl border border-slate-200 text-right animate-in fade-in">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="text-sm font-black text-slate-900">حجز موعد ({slotDate} - {slotTime})</h3>
                  <button onClick={() => setShowSlotModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <form onSubmit={handleSaveSlot} className="space-y-3">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">المريض:</label>
                    <select
                      value={slotPatientId}
                      onChange={e => setSlotPatientId(e.target.value)}
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                    >
                      {patients.map(p => (
                        <option key={p.id} value={p.id}>{p.name} ({p.phone})</option>
                      ))}
                    </select>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">التخصص والعيادة:</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => { setSlotSpecialty('dental'); setSlotDoctor('د. فهد العنزي'); setSlotService('كشف استشاري وخطة علاج أسنان'); setSlotPrice(150); }}
                        className={"p-2.5 rounded-xl border font-bold transition " + (slotSpecialty === 'dental' ? 'bg-brand-600 text-white' : 'bg-slate-50')}
                      >
                        🦷 عيادة الأسنان
                      </button>
                      <button
                        type="button"
                        onClick={() => { setSlotSpecialty('dermatology'); setSlotDoctor('د. سلمى الشمري'); setSlotService('جلسة كشف واستشارة جلدية'); setSlotPrice(200); }}
                        className={"p-2.5 rounded-xl border font-bold transition " + (slotSpecialty === 'dermatology' ? 'bg-teal-600 text-white' : 'bg-slate-50')}
                      >
                        ✨ الجلدية والتجميل
                      </button>
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">الطبيب المعالج:</label>
                    <input type="text" readOnly value={slotDoctor} className="w-full p-2.5 bg-slate-100 border border-slate-200 rounded-xl font-bold" />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">الخدمة الطبية المقررة:</label>
                    <input
                      type="text"
                      value={slotService}
                      onChange={e => setSlotService(e.target.value)}
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowSlotModal(false)} className="px-4 py-2 border rounded-xl font-bold">إلغاء</button>
                    <button type="submit" className="px-5 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-black shadow-md">
                      تأكيد الحجز والإدراج بالانتظار 🚀
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Dermatology Session Modal */}
          {showDermaModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-lg w-full p-6 space-y-4 text-xs shadow-2xl border border-slate-200 text-right animate-in fade-in">
                <div className="flex justify-between items-center border-b pb-2">
                  <h3 className="text-sm font-black text-teal-900">تسجيل جلسة جلدية / ليزر للمريض: {selectedPatient.name}</h3>
                  <button onClick={() => setShowDermaModal(false)} className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>
                <form onSubmit={handleAddDermaSession} className="space-y-3">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">الجهاز المستخدم:</label>
                    <select
                      value={dermaDevice}
                      onChange={e => setDermaDevice(e.target.value)}
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                    >
                      <option value="Candela GentleMax Pro (Alexandrite 755nm)">Candela GentleMax Pro (Alexandrite 755nm)</option>
                      <option value="Candela GentleMax Pro (Nd:YAG 1064nm)">Candela GentleMax Pro (Nd:YAG 1064nm)</option>
                      <option value="Cynosure Elite+ Laser">Cynosure Elite+ Laser</option>
                      <option value="Profhilo BAP Skin Booster">Profhilo BAP Skin Booster</option>
                      <option value="Botox Allergan Cosmetic">Botox Allergan Cosmetic</option>
                      <option value="Juvederm Ultra Filler">Juvederm Ultra Filler</option>
                    </select>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">اسم الجلسة / الإجراء:</label>
                    <input
                      type="text"
                      value={dermaTreatment}
                      onChange={e => setDermaTreatment(e.target.value)}
                      className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                    />
                  </div>

                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">الطاقة (Fluence):</label>
                      <input
                        type="text"
                        value={dermaFluence}
                        onChange={e => setDermaFluence(e.target.value)}
                        className="w-full p-2 bg-slate-50 border rounded-xl font-mono"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">عرض النبضة:</label>
                      <input
                        type="text"
                        value={dermaPulse}
                        onChange={e => setDermaPulse(e.target.value)}
                        className="w-full p-2 bg-slate-50 border rounded-xl font-mono"
                      />
                    </div>
                    <div>
                      <label className="block font-bold text-slate-700 mb-1">حجم البقعة:</label>
                      <input
                        type="text"
                        value={dermaSpot}
                        onChange={e => setDermaSpot(e.target.value)}
                        className="w-full p-2 bg-slate-50 border rounded-xl font-mono"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">المناطق المعالجة:</label>
                    <input
                      type="text"
                      value={dermaAreas}
                      onChange={e => setDermaAreas(e.target.value)}
                      className="w-full p-2.5 bg-slate-50 border rounded-xl font-medium"
                    />
                  </div>

                  <div>
                    <label className="block font-bold text-slate-700 mb-1">ملاحظات الطبيب:</label>
                    <input
                      type="text"
                      value={dermaNotes}
                      onChange={e => setDermaNotes(e.target.value)}
                      placeholder="توصيات العناية واستجابة الجلد..."
                      className="w-full p-2.5 bg-slate-50 border rounded-xl font-medium"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setShowDermaModal(false)} className="px-4 py-2 border rounded-xl font-bold">إلغاء</button>
                    <button type="submit" className="px-5 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-black shadow-md">
                      حفظ الجلسة في ملف المريض 💾
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Printable Prescription Template (Visible during window.print()) */}
          <div className="hidden print-area p-8 bg-white text-black" dir="rtl">
            {selectedRx && (
              <div className="space-y-6 max-w-2xl mx-auto border-2 border-slate-900 p-8 rounded-2xl">
                <div className="flex justify-between items-center border-b-2 border-slate-900 pb-4">
                  <div>
                    <h1 className="text-xl font-black">{settings.name}</h1>
                    <p className="text-xs text-slate-600">{settings.nameEn}</p>
                    <p className="text-xs text-slate-500">{settings.branch} • هاتف: {settings.phone}</p>
                  </div>
                  <div className="text-left">
                    <div className="text-lg font-black text-slate-900">وصفة طبية إلكترونية</div>
                    <div className="font-mono text-xs font-bold">{selectedRx.id}</div>
                    <div className="text-xs text-slate-500">{selectedRx.date}</div>
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl text-xs border">
                  <div>
                    <div><strong>اسم المريض:</strong> {selectedRx.patientName}</div>
                    <div><strong>رقم الهوية:</strong> {selectedRx.nationalId || '10XXXXXXXX'}</div>
                  </div>
                  <div>
                    <div><strong>الطبيب المعالج:</strong> {selectedRx.doctorName}</div>
                    <div><strong>التخصص / الترخيص:</strong> {selectedRx.doctorTitle}</div>
                  </div>
                </div>

                <div>
                  <div className="text-xs font-bold mb-1"><strong>التشخيص السريري:</strong> {selectedRx.diagnosis}</div>
                </div>

                <div className="space-y-2">
                  <div className="font-serif text-2xl font-black">℞</div>
                  <table className="w-full text-right text-xs border-collapse border border-slate-300">
                    <thead>
                      <tr className="bg-slate-100 border-b">
                        <th className="p-2 border">#</th>
                        <th className="p-2 border">اسم الدواء والعيار</th>
                        <th className="p-2 border">الجرعة والتكرار</th>
                        <th className="p-2 border">المدة</th>
                        <th className="p-2 border">التعليمات</th>
                      </tr>
                    </thead>
                    <tbody>
                      {selectedRx.items.map((it, idx) => (
                        <tr key={idx} className="border-b">
                          <td className="p-2 border font-bold">{idx + 1}</td>
                          <td className="p-2 border font-bold">{it.drugName} ({it.dosage})</td>
                          <td className="p-2 border">{it.frequency}</td>
                          <td className="p-2 border">{it.duration}</td>
                          <td className="p-2 border">{it.instructions}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>

                <div className="pt-8 flex justify-between items-end text-xs">
                  <div className="text-slate-400 text-[10px]">صدرت هذه الوصفة إلكترونياً ولا تتطلب ختماً ورقياً.</div>
                  <div className="text-center">
                    <div className="font-bold">{selectedRx.doctorName}</div>
                    <div className="text-[10px] text-slate-500">توقيع وختم الطبيب المعتمد</div>
                    <div className="w-32 border-b-2 border-slate-900 mt-6 mx-auto"></div>
                  </div>
                </div>
              </div>
            )}
          </div>

        </div>
      );
    }

    // Render React Root
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
