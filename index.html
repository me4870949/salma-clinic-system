    function generateZatcaTlvBase64(sellerName, vatNumber, timeIso, totalAmount, vatAmount) {
      try {
        const encodeTag = (tagNum, strVal) => {
          const utf8 = unescape(encodeURIComponent(strVal || ''));
          const len = utf8.length;
          return String.fromCharCode(tagNum) + String.fromCharCode(len) + utf8;
        };

        const tlvString = 
          encodeTag(1, sellerName || 'مركز سلمي لطب الأسنان والجلدية') +
          encodeTag(2, vatNumber || '310489201900003') +
          encodeTag(3, timeIso || new Date().toISOString()) +
          encodeTag(4, parseFloat(totalAmount || 0).toFixed(2)) +
          encodeTag(5, parseFloat(vatAmount || 0).toFixed(2));

        return btoa(tlvString);
      } catch (err) {
        console.error('ZATCA TLV error:', err);
        return btoa('ZATCA|' + sellerName + '|' + vatNumber + '|' + totalAmount);
      }
    }

              { name: "نتيجة الفحص المخبري", value: uploadParams || "ضمن المعدل المعتمد", unit: "-", range: "مرجع سريري", flag: uploadStatus }
            ],
            notes: uploadNotes || "تم الفحص والتدقيق الآلي في مختبر المركز واعتماد النتيجة.",
            fileUrl: uploadFileUrl || "https://images.unsplash.com/photo-1579154204601-01588f351e67?auto=format&fit=crop&q=80&w=700",
            isNew: true,
            reviewedByDoctor: false
          };

          const updated = {
            ...targetPatient,
            labResults: [newLabItem, ...(targetPatient.labResults || [])]
          };

          const newPatients = patients.map(p => p.id === updated.id ? updated : p);
          setPatients(newPatients);
          if (selectedPatient.id === updated.id) setSelectedPatient(updated);
          setShowUploadModal(false);
          alert('✅ تم اعتماد ومزامنة نتيجة التحليل المخبري فورياً مع ملف المريض (' + targetPatient.name + ') وإشعار الطبيب المعالج.');
        } else {
          const newRadItem = {
            id: "RAD-" + Math.floor(100 + Math.random() * 900),
            studyName: uploadTestName,
            modality: "الأشعة الرقمية والتصوير التشخيصي",
            date: dateStr,
            time: timeStr,
            orderingDoctor: uploadDoctor,
            technician: user ? user.name : "فني الأشعة: عبد العزيز الرويلي",
            status: uploadStatus,
            statusLabel: uploadStatus === 'normal' ? 'طبيعي (Clear)' : uploadStatus === 'critical' ? 'حرج (Urgent Finding)' : 'تغيرات تتطلب متابعة',
            findings: uploadParams || "تم إجراء التصوير الشعاعي عالي الدقة وتوثيق الملاحظات.",
            recommendations: uploadNotes || "المتابعة مع الطبيب المعالج لمطابقة الخطة العلاجية.",
            imageUrl: uploadFileUrl || "https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?auto=format&fit=crop&q=80&w=700",
            isNew: true,
            reviewedByDoctor: false
          };

          const updated = {
            ...targetPatient,
            radiologyRecords: [newRadItem, ...(targetPatient.radiologyRecords || [])]
          };

          const newPatients = patients.map(p => p.id === updated.id ? updated : p);
          setPatients(newPatients);
          if (selectedPatient.id === updated.id) setSelectedPatient(updated);
          setShowUploadModal(false);
          alert('✅ تم رفع ومزامنة تقرير الأشعة والتصوير فورياً مع ملف المريض (' + targetPatient.name + ') وإشعار الطبيب المعالج.');
        }
      };

      // Mark result as reviewed by clinician with single click
      const handleMarkResultReviewed = (patientId, itemId, category) => {
        const target = patients.find(p => p.id === patientId);
        if (!target) return;

        let updated;
        if (category === 'lab') {
          updated = {
            ...target,
            labResults: (target.labResults || []).map(r => r.id === itemId ? { ...r, isNew: false, reviewedByDoctor: true } : r)
          };
        } else {
          updated = {
            ...target,
            radiologyRecords: (target.radiologyRecords || []).map(r => r.id === itemId ? { ...r, isNew: false, reviewedByDoctor: true } : r)
          };
        }

        const newPatients = patients.map(p => p.id === updated.id ? updated : p);
        setPatients(newPatients);
        if (selectedPatient.id === updated.id) setSelectedPatient(updated);
        alert('🩺 تم تأكيد مراجعة الطبيب واعتماد التقرير سريرياً.');
      };

      // --- White-Label SaaS Settings Handlers ---
      const handleSaveSettings = (e) => {
        e.preventDefault();

      };

      const handleSaveToothCondition = (e) => {
        e.preventDefault();
        if (!selectedTooth) return;
        const conditionObj = TOOTH_CONDITIONS[toothCondition] || TOOTH_CONDITIONS['composite-filling'];
        
        const newRecord = {
          toothNumber: selectedTooth,
          condition: toothCondition,
          conditionLabel: conditionObj.label.split(' ')[0],
          surface: toothSurface,
          date: new Date().toISOString().split('T')[0],
          doctor: user?.name || 'د. فهد العنزي',
          notes: toothNotes || 'إجراء علاجي مسجل في مخطط الأسنان'
        };

        const currentRecords = selectedPatient.dentalRecords || [];
        const existingIdx = currentRecords.findIndex(r => r.toothNumber === selectedTooth);
        let updatedRecords;
        if (existingIdx >= 0) {
          updatedRecords = [...currentRecords];
          updatedRecords[existingIdx] = newRecord;

          updatedRecords = [newRecord, ...currentRecords];

        const updatedPatient = { ...selectedPatient, dentalRecords: updatedRecords };

        e.preventDefault();

      const handleSaveSlot = (e) => {

        setAppointments(appointments.map(a => a.id === id ? { ...a, status, statusLabel: labels[status] || a.statusLabel } : a));

      const handleToothClick = (toothNumber) => {

      const handlePatientBookingSubmit = (e) => {
        e.preventDefault();
        const targetPatient = (user && user.role === 'patient') ? (currentPatientObj || user) : (selectedPatient || patients[0]);
        const newAppt = {
          id: "APT-2026-" + String(appointments.length + 1).padStart(3, '0'),

      };

      // --- WhatsApp Webhook & API Sender ---
      const handleSendWhatsAppWebhook = async (apt) => {
        const phone = apt ? apt.phone : waPhone;
        const text = apt
          ? ('تذكير بموعدكم في ' + settings.name + '\nالتاريخ: ' + apt.date + ' | الوقت: ' + apt.time + '\nالطبيب: ' + apt.doctorName + '\nالخدمة: ' + apt.serviceName)
          : waMessage;
        const cleanPhone = phone.replace(/[^0-9]/g, '');
        const formattedPhone = cleanPhone.startsWith('05') ? '966' + cleanPhone.substring(1) : cleanPhone.startsWith('5') ? '966' + cleanPhone : cleanPhone;

        const payload = {
          chatId: formattedPhone + "@c.us",
          text: text,
          session: "default",
          metadata: {
            clinic: settings.name,
            patientId: apt ? apt.patientId : waPatientId,
            timestamp: new Date().toISOString()
          }
        };

        const newLog = {
          id: 'WA-' + Date.now(),
          patientName: apt ? apt.patientName : ((patients.find(p => p.id === waPatientId) || {}).name || ''),
          time: new Date().toLocaleTimeString('ar-SA'),
          phone: formattedPhone,
          text: text,
          status: 'sent',
          payload
        };

        setWaStatusLog([newLog, ...waStatusLog]);

        const waUrl = "https://wa.me/" + formattedPhone + "?text=" + encodeURIComponent(text);
        window.open(waUrl, '_blank');
      };

      // --- Financial & Analytics Calculations ---
      const totalClinicGross = invoices.reduce((s, i) => s + i.subtotal, 0);
      const totalClinicVat = invoices.reduce((s, i) => s + i.vatAmount, 0);
      const totalClinicWithVat = invoices.reduce((s, i) => s + i.totalWithVat, 0);

      const paymentBreakdown = useMemo(() => {
        const mada = invoices.filter(i => i.paymentMethod === 'mada').reduce((s, i) => s + i.totalWithVat, 0);
        const apple = invoices.filter(i => i.paymentMethod === 'applepay').reduce((s, i) => s + i.totalWithVat, 0);
        const cash = invoices.filter(i => i.paymentMethod === 'cash').reduce((s, i) => s + i.totalWithVat, 0);
        const total = totalClinicWithVat || 1;
        return {
          mada: { amount: mada, pct: Math.round((mada / total) * 100) },
          apple: { amount: apple, pct: Math.round((apple / total) * 100) },
          cash: { amount: cash, pct: Math.round((cash / total) * 100) }
        };
      }, [invoices, totalClinicWithVat]);

      const doctorStats = useMemo(() => {
        return doctors.map(doc => {
          const docInvs = invoices.filter(inv => inv.doctorName === doc.name || inv.doctorId === doc.id);
          const gross = docInvs.reduce((s, i) => s + i.subtotal, 0);
          const commRate = doc.commissionRate || 30;
          const commAmt = parseFloat(((gross * commRate) / 100).toFixed(2));
          const base = doc.baseSalary || 15000;
          const payout = parseFloat((base + commAmt).toFixed(2));
          const clinicNet = parseFloat((gross - commAmt).toFixed(2));
          return { ...doc, gross, commAmt, payout, clinicNet, count: docInvs.length };
        });
      }, [doctors, invoices]);

      const totalDoctorComms = doctorStats.reduce((s, d) => s + d.commAmt, 0);
      const totalClinicNetProfit = Math.max(0, totalClinicGross - totalDoctorComms);

      // --- Finance Dashboard Aliases ---
      const totalRevenue = totalClinicWithVat;
      const totalTax = totalClinicVat;
      const totalDoctorCommissions = totalDoctorComms;
      const netCenterProfit = totalClinicNetProfit;

      // --- Current Logged-in Patient's Own Records (Patient Portal) ---
      const currentPatientObj = useMemo(() => {
        if (!user) return selectedPatient;
        return patients.find(p => p.id === user.id) || selectedPatient;
      }, [patients, user, selectedPatient]);

      const currentPatientAppts = useMemo(() => {
        if (!currentPatientObj) return [];
        return appointments.filter(a => a.patientId === currentPatientObj.id);
      }, [appointments, currentPatientObj]);

      const currentPatientRx = useMemo(() => {
        if (!currentPatientObj) return [];
        return prescriptions.filter(r => r.patientId === currentPatientObj.id);
      }, [prescriptions, currentPatientObj]);

      const currentPatientInvoices = useMemo(() => {
        if (!currentPatientObj) return [];
        return invoices.filter(i => i.patientId === currentPatientObj.id);
      }, [invoices, currentPatientObj]);

      // --- Smart Inbound Archive Counters ---
      const pendingLabsCount = useMemo(() => {
        return patients.reduce((count, p) => {
          const labs = (p.labResults || []).filter(r => !r.reviewed).length;
          const rads = (p.radiologyRecords || []).filter(r => !r.reviewed).length;
          return count + labs + rads;
        }, 0);
      }, [patients]);

      const criticalAlertsCount = useMemo(() => {
        return patients.reduce((count, p) => {
          const labs = (p.labResults || []).filter(r => r.status === 'critical').length;
          const rads = (p.radiologyRecords || []).filter(r => r.status === 'critical').length;
          return count + labs + rads;
        }, 0);
      }, [patients]);

      // --- Dental Odontogram Map (Tooth Number -> Condition) for Selected Patient ---
      const dentalTeeth = useMemo(() => {
        const map = {};
        (selectedPatient?.dentalRecords || []).forEach(r => {
          map[r.toothNumber] = r.condition;
        });
        return map;
      }, [selectedPatient]);

      // --- Appointments Directory Filter ---
      const filteredAppointments = useMemo(() => {
        if (apptFilter === 'dental') return appointments.filter(a => a.specialty === 'dental');
        if (apptFilter === 'derma') return appointments.filter(a => a.specialty === 'dermatology');
        if (apptFilter === 'today') return appointments.filter(a => a.date === '2026-09-05');
        return appointments;
      }, [appointments, apptFilter]);

      // --- Patients Directory Search ---
      const filteredPatients = useMemo(() => {
        const q = patientSearchQuery.trim().toLowerCase();
        if (!q) return patients;
        return patients.filter(p =>
          p.name.toLowerCase().includes(q) ||
          (p.fileNumber || '').toLowerCase().includes(q) ||
          (p.nationalId || '').includes(q) ||
          (p.phone || '').includes(q)
        );
      }, [patients, patientSearchQuery]);

      const timeSlots = ['09:00', '10:00', '11:00', '12:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00'];
      const weekDays = [
        { label: 'السبت', date: '2026-09-04' },
        { label: 'الأحد', date: '2026-09-05' },
        { label: 'الاثنين', date: '2026-09-06' },
        { label: 'الثلاثاء', date: '2026-09-07' },
        { label: 'الأربعاء', date: '2026-09-08' }
      ];

      if (currentPath === '/login' || !user) {
        return (

            <div className="absolute -top-32 -right-32 w-96 h-96 bg-brand-500/15 rounded-full blur-3xl pointer-events-none"></div>

              <div className="inline-flex p-4 bg-gradient-to-tr from-brand-600 to-sky-400 rounded-3xl text-white text-3xl mb-4 shadow-xl shadow-brand-500/20 ring-4 ring-white/10">
                🦷

                {settings.name}

                {settings.nameEn} • {settings.branch}
              </p>
              <p className="text-slate-400 text-xs mt-1">
                بوابة المرضى والإدارة الطبية الذكية الموحدة والأرشيف المخبري والشعاعي
              </p>

                >
                  <span>👤 بوابة المرضى (الاسم + الهوية)</span>
                </button>

                  onClick={() => setLoginTab('staff')}

                >
                  <span>🔑 دخول الكادر الطبي والإداري</span>
                </button>

                    <input

                </div>

                    >
                      <div className="text-xs font-black text-white group-hover:text-sky-300 transition">{d.label}</div>
                      <div className="text-[11px] text-slate-400 mt-0.5">{d.name}</div>
                      <div className="text-[9px] font-mono text-sky-400 mt-1" dir="ltr">{d.route}</div>
                    </button>
                  ))}
                </div>
              </div>

            </div>
          </div>
        );
      }

      // --- MAIN AUTHENTICATED APP LAYOUT ---
      return (
        <div className="min-h-screen flex flex-col bg-[#f8fafc] font-sans antialiased text-slate-800" dir="rtl">
          
          {/* Top Sticky Header */}
          <header className="bg-white border-b border-slate-200/80 sticky top-0 z-30 shadow-sm shadow-slate-100">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              
              {/* Brand Logo & Name */}
              <div
                className="flex items-center gap-3 cursor-pointer group"
                onClick={() => {
                  if (user.role === 'patient') setCurrentPath('/dashboard/patient');
                  else if (user.role === 'doctor') setCurrentPath('/dashboard/doctor');
                  else if (user.role === 'receptionist') setCurrentPath('/dashboard/reception');
                  else if (user.role === 'finance') setCurrentPath('/dashboard/finance');
                  else if (user.role === 'owner') setCurrentPath('/dashboard/owner');
                }}
              >
                <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-sky-500 text-white flex items-center justify-center text-xl font-black shadow-md shadow-brand-500/20 group-hover:scale-105 transition">
                  🦷
                </div>
                <div>
                  <h1 className="text-sm sm:text-base font-black text-slate-900 leading-tight group-hover:text-brand-600 transition">
                    {settings.name}
                  </h1>
                  <p className="text-[11px] text-slate-500 font-medium">
                    {settings.branch}
                  </p>
                </div>
              </div>

              {/* Top Navigation Switchers & User Profile */}
              <div className="flex items-center gap-2 sm:gap-4">
                
                {/* Direct Inbound Upload Trigger for Staff */}
                {user.role !== 'patient' && (
                  <button
                    onClick={() => setShowUploadModal(true)}
                    className="hidden md:flex items-center gap-1.5 px-3 py-1.5 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white rounded-xl text-xs font-bold shadow-sm shadow-emerald-500/20 transition"
                  >
                    <span>🧪</span>
                    <span>+ مزامنة تحاليل / أشعة</span>
                  </button>
                )}

                {/* 5 Demo Roles Quick Pills */}
                <div className="hidden xl:flex bg-slate-100 p-1 rounded-2xl border border-slate-200/60">
                  {DEMO_CREDENTIALS.map(d => (
                    <button
                      key={d.role}
                      type="button"
                      onClick={() => handleDemoLogin(d.role)}
                      className={"px-2.5 py-1 rounded-xl text-xs font-bold transition " + (user.role === d.role ? 'bg-white text-slate-900 shadow-sm border border-slate-200/50' : 'text-slate-500 hover:text-slate-900')}
                    >
                      {d.role === 'patient' ? 'مريض' : d.role === 'doctor' ? 'طبيب' : d.role === 'receptionist' ? 'استقبال' : d.role === 'finance' ? 'مالية' : 'مالك المركز'}
                    </button>
                  ))}
                </div>

                {/* Settings Shortcut Button (Owner only) */}
                {user.role === 'owner' && (
                  <button
                    onClick={() => setCurrentPath('/settings')}
                    className={"p-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 border " + (currentPath === '/settings' ? 'bg-brand-50 text-brand-700 border-brand-300' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100')}
                    title="إعدادات وهوية المركز"
                  >
                    <span>⚙️</span>
                    <span className="hidden sm:inline">إعدادات وهوية المركز</span>
                  </button>
                )}

                {/* Logged in User Tag & Logout */}
                <div className="flex items-center gap-2.5 pr-2 border-r border-slate-200">
                  <div className="hidden md:block text-left text-xs font-bold text-slate-900">
                    <div>{user.name}</div>
                    <div className="text-[10px] text-slate-500">{user.specialtyName}</div>
                  </div>
                  
                  <img
                    src={user.avatar || "https://images.unsplash.com/photo-1559839734-2b71ea197ec2?auto=format&fit=crop&q=80&w=200"}
                    alt={user.name}
                    className="w-9 h-9 rounded-xl object-cover ring-2 ring-slate-200"
                  />

                  <button
                    onClick={() => { setUser(null); setCurrentPath('/login'); }}
                    className="p-2 text-xs text-rose-600 bg-rose-50 hover:bg-rose-100 border border-rose-200 rounded-xl font-bold transition"
                    title="تسجيل الخروج"
                  >
                    خروج
                  </button>
                </div>

              </div>

            </div>
          </header>

          {/* Main Content Layout with Sidebar */}
          <div className="flex-1 max-w-7xl w-full mx-auto flex">
            
            {/* Sidebar Navigation */}
            <aside className="w-60 bg-white border-l border-slate-200/80 p-4 shrink-0 hidden lg:flex flex-col justify-between sidebar-container shadow-sm">
              <div className="space-y-6">
                
                {/* Clinic Badge */}
                <div className="p-3 bg-brand-50/60 rounded-2xl border border-brand-100 text-xs">
                  <div className="text-brand-900 font-extrabold flex items-center gap-1.5">
                    <span className="w-2 h-2 rounded-full bg-brand-500 animate-pulse"></span>
                    <span>{settings.nameEn}</span>
                  </div>
                  <div className="text-[10px] text-brand-700 mt-0.5">أرشيف طبي ومخبري ذكي</div>
                </div>

                {/* Dashboards Section */}
                <div className="space-y-1">
                  <div className="px-2 text-[10px] font-black text-slate-400 uppercase tracking-wider mb-2">لوحات التحكم</div>
                  
                  {user.role === 'patient' && (
                    <button
                      onClick={() => setCurrentPath('/dashboard/patient')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/dashboard/patient' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>👤</span>
                      <span>بوابة المريض وسجلي</span>
                    </button>
                  )}

                  {user.role === 'doctor' && (
                    <button
                      onClick={() => setCurrentPath('/dashboard/doctor')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/dashboard/doctor' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>🩺</span>
                      <span>كشف الطبيب والأرشيف</span>
                    </button>
                  )}

                  {['receptionist', 'doctor', 'finance', 'owner'].includes(user.role) && (
                    <button
                      onClick={() => setCurrentPath('/dashboard/reception')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/dashboard/reception' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>📅</span>
                      <span>كاونتر الاستقبال والانتظار</span>
                    </button>
                  )}

                  {['finance', 'owner'].includes(user.role) && (
                    <button
                      onClick={() => setCurrentPath('/dashboard/finance')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/dashboard/finance' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>💼</span>
                      <span>التقارير المالية والضريبة</span>
                    </button>
                  )}

                  {user.role === 'owner' && (
                    <button
                      onClick={() => setCurrentPath('/dashboard/owner')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/dashboard/owner' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>👑</span>
                      <span>مالك المركز وعمولات الأطباء</span>
                    </button>
                  )}
                </div>

                {/* Operations Section */}
                <div className="space-y-1">
                  <div className="px-2 text-[10px] font-black text-slate-400 uppercase tracking-wider mb-2">الأرشيف الطبي والخدمات</div>
                  
                  {user.role !== 'patient' && (
                    <button
                      onClick={() => setShowUploadModal(true)}
                      className="w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 bg-emerald-50 text-emerald-800 hover:bg-emerald-100 border border-emerald-200"
                    >
                      <span>🧪</span>
                      <span>+ رفع تحاليل وأشعة (Inbound)</span>
                    </button>
                  )}

                  <button
                    onClick={() => setCurrentPath('/appointments')}
                    className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/appointments' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                  >
                    <span>🗓</span>
                    <span>التقويم التفاعلي (Click-to-Add)</span>
                  </button>

                  {user.role !== 'patient' && (
                    <button
                      onClick={() => setCurrentPath('/patients')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/patients' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>👥</span>
                      <span>سجل المرضى والأرشيف EMR</span>
                    </button>
                  )}

                  <button
                    onClick={() => setCurrentPath('/prescriptions')}
                    className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/prescriptions' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                  >
                    <span>📄</span>
                    <span>الروشتات والوصفات الطبية</span>
                  </button>

                  <button
                    onClick={() => setCurrentPath('/invoices')}
                    className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/invoices' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                  >
                    <span>🧾</span>
                    <span>الفواتير 15% ZATCA QR</span>
                  </button>

                  {user.role !== 'patient' && (
                    <button
                      onClick={() => setCurrentPath('/whatsapp-notifications')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/whatsapp-notifications' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>💬</span>
                      <span>إشعارات الواتساب التلقائية</span>
                    </button>
                  )}

                  {user.role === 'owner' && (
                    <button
                      onClick={() => setCurrentPath('/settings')}
                      className={"w-full text-right px-3 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 " + (currentPath === '/settings' ? 'bg-brand-600 text-white shadow-md' : 'text-slate-600 hover:bg-slate-100')}
                    >
                      <span>⚙️</span>
                      <span>إعدادات وهوية المركز (SaaS)</span>
                    </button>
                  )}
                </div>

              </div>

              {/* Sidebar Footer */}
              <div className="pt-4 border-t border-slate-100 text-right">
                <div className="text-[11px] font-bold text-slate-700">{settings.name}</div>
                <div className="text-[10px] text-slate-400 font-mono" dir="ltr">{settings.phone}</div>
              </div>
            </aside>

            {/* Main Dynamic Viewport Container */}
            <main className="flex-1 p-4 sm:p-6 lg:p-8 min-w-0 overflow-y-auto">

              {/* ============================================================ */}
              {/* 1. PATIENT DASHBOARD (/dashboard/patient)                   */}
              {/* ============================================================ */}
              {currentPath === '/dashboard/patient' && (
                <div className="space-y-6">
                  {/* Patient Header Card */}
                  <div className="bg-gradient-to-l from-brand-700 via-brand-600 to-indigo-700 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-64 h-64 bg-white/10 rounded-full blur-3xl -translate-x-12 -translate-y-12"></div>
                    <div className="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-4">
                      <div>
                        <div className="flex items-center gap-3">
                          <span className="w-12 h-12 rounded-2xl bg-white/20 backdrop-blur-md flex items-center justify-center text-2xl font-bold">
                            👤
                          </span>
                          <div>
                            <h2 className="text-2xl font-black">{user?.name || 'المريض'}</h2>
                            <p className="text-brand-100 text-xs mt-0.5">
                              رقم الملف الطبي: <span className="font-mono font-bold">{currentPatientObj?.fileNumber || 'MED-2026-001'}</span> | الهوية الوطنية: <span className="font-mono">{currentPatientObj?.nationalId || user?.nationalId || '1098765432'}</span>
                            </p>
                          </div>
                        </div>
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => setPatientTab('book')}
                          className="bg-white text-brand-700 font-bold px-4 py-2.5 rounded-xl shadow hover:bg-brand-50 transition text-xs flex items-center gap-2"
                        >
                          <span>📅</span>
                          <span>حجز موعد جديد</span>
                        </button>
                      </div>
                    </div>

                    {/* Patient Tab Navigation */}
                    <div className="mt-6 flex flex-wrap gap-2 border-t border-white/20 pt-4 text-xs font-bold">
                      <button
                        onClick={() => setPatientTab('appointments')}
                        className={"px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 " + (patientTab === 'appointments' ? 'bg-white text-brand-700 shadow' : 'bg-white/10 text-white hover:bg-white/20')}
                      >
                        <span>📅</span>
                        <span>مواعيدي ({currentPatientAppts.length})</span>
                      </button>
                      <button
                        onClick={() => setPatientTab('history')}
                        className={"px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 " + (patientTab === 'history' ? 'bg-white text-brand-700 shadow' : 'bg-white/10 text-white hover:bg-white/20')}
                      >
                        <span>📋</span>
                        <span>السجل الطبي الشامل</span>
                      </button>
                      <button
                        onClick={() => setPatientTab('labs')}
                        className={"px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 " + (patientTab === 'labs' ? 'bg-white text-brand-700 shadow' : 'bg-white/10 text-white hover:bg-white/20')}
                      >
                        <span>🧪</span>
                        <span>نتائج التحاليل والمختبر ({currentPatientObj?.labResults?.length || 0})</span>
                      </button>
                      <button
                        onClick={() => setPatientTab('radiology')}
                        className={"px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 " + (patientTab === 'radiology' ? 'bg-white text-brand-700 shadow' : 'bg-white/10 text-white hover:bg-white/20')}
                      >
                        <span>🩻</span>
                        <span>الأشعة والتصوير الطبي ({currentPatientObj?.radiologyRecords?.length || 0})</span>
                      </button>
                      <button
                        onClick={() => setPatientTab('prescriptions')}
                        className={"px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 " + (patientTab === 'prescriptions' ? 'bg-white text-brand-700 shadow' : 'bg-white/10 text-white hover:bg-white/20')}
                      >
                        <span>💊</span>
                        <span>الوصفات الإلكترونية ({currentPatientRx.length})</span>
                      </button>
                      <button
                        onClick={() => setPatientTab('invoices')}
                        className={"px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 " + (patientTab === 'invoices' ? 'bg-white text-brand-700 shadow' : 'bg-white/10 text-white hover:bg-white/20')}
                      >
                        <span>🧾</span>
                        <span>الفواتير الضريبية ({currentPatientInvoices.length})</span>
                      </button>
                      <button
                        onClick={() => setPatientTab('book')}
                        className={"px-3.5 py-2 rounded-xl transition flex items-center gap-1.5 " + (patientTab === 'book' ? 'bg-white text-brand-700 shadow' : 'bg-white/10 text-white hover:bg-white/20')}
                      >
                        <span>✨</span>
                        <span>طلب حجز إلكتروني</span>
                      </button>
                    </div>
                  </div>

                  {/* Tab 1: Appointments */}
                  {patientTab === 'appointments' && (
                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 space-y-4">
                      <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                        <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                          <span>📅</span>
                          <span>سجل المواعيد القادمة والسابقة</span>
                        </h3>
                        <span className="text-xs text-slate-500 font-medium">إجمالي المواعيد: {currentPatientAppts.length}</span>
                      </div>

                      {currentPatientAppts.length === 0 ? (
                        <div className="text-center py-12 text-slate-400">
                          <span className="text-4xl block mb-2">📅</span>
                          <p className="text-sm font-bold text-slate-600">لا توجد مواعيد مسجلة حالياً</p>
                          <button onClick={() => setPatientTab('book')} className="mt-3 text-xs text-brand-600 font-bold hover:underline">
                            + اضغط هنا لحجز موعدك الأول
                          </button>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {currentPatientAppts.map(apt => (
                            <div key={apt.id} className="p-4 rounded-2xl border border-slate-200 hover:border-brand-400 transition bg-slate-50/50 flex flex-col justify-between">
                              <div className="space-y-2">
                                <div className="flex items-center justify-between">
                                  <span className={"px-2.5 py-1 rounded-full text-[10px] font-black " + (
                                    apt.status === 'confirmed' ? 'bg-emerald-100 text-emerald-700' :
                                    apt.status === 'pending' ? 'bg-amber-100 text-amber-700' :
                                    apt.status === 'cancelled' ? 'bg-rose-100 text-rose-700' :
                                    'bg-blue-100 text-blue-700'
                                  )}>
                                    {apt.status === 'confirmed' ? 'مؤكد' : apt.status === 'pending' ? 'قيد الانتظار' : apt.status === 'cancelled' ? 'ملغي' : 'مكتمل'}
                                  </span>
                                  <span className="text-xs font-bold text-slate-500">{apt.specialty}</span>
                                </div>
                                <h4 className="font-bold text-slate-800 text-sm">{apt.serviceName}</h4>
                                <p className="text-xs text-slate-600 flex items-center gap-2">
                                  <span>👨‍⚕️</span>
                                  <span>الطبيب المعالج: {apt.doctorName}</span>
                                </p>
                                <div className="text-xs text-slate-500 flex items-center gap-4 pt-1">
                                  <span className="font-mono">🗓️ {apt.date}</span>
                                  <span className="font-mono">⏰ {apt.time}</span>
                                </div>
                              </div>
                              {apt.status !== 'cancelled' && (
                                <div className="mt-4 pt-3 border-t border-slate-200/60 flex items-center justify-between">
                                  <span className="text-[11px] text-slate-400">إلغاء الموعد متاح قبل 6 ساعات</span>
                                  <button
                                    onClick={() => handleCancelAppt(apt.id)}
                                    className="text-xs font-bold text-rose-600 hover:text-rose-700 hover:bg-rose-50 px-2.5 py-1 rounded-lg transition"
                                  >
                                    إلغاء الموعد
                                  </button>
                                </div>
                              )}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* Tab 2: Medical History */}
                  {patientTab === 'history' && (
                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 space-y-6">
                      <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                        <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                          <span>📋</span>
                          <span>السجل الطبي والإجراءات السابقة</span>
                        </h3>
                        <span className="text-xs bg-brand-50 text-brand-700 px-3 py-1 rounded-full font-bold">ملف معتمد ومحدث</span>
                      </div>

                      {/* General Patient Clinical Card */}
                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-2xl border border-slate-200">
                        <div>
                          <span className="text-[11px] text-slate-400 block">فصيلة الدم</span>
                          <span className="text-sm font-bold font-mono text-slate-800">{currentPatientObj?.bloodGroup || 'O+'}</span>
                        </div>
                        <div>
                          <span className="text-[11px] text-slate-400 block">الحساسية المفرطة</span>
                          <span className="text-sm font-bold text-rose-600">{currentPatientObj?.allergies || 'لا توجد'}</span>
                        </div>
                        <div>
                          <span className="text-[11px] text-slate-400 block">الأمراض المزمنة</span>
                          <span className="text-sm font-bold text-slate-800">{currentPatientObj?.chronicDiseases || 'لا يوجد'}</span>
                        </div>
                        <div>
                          <span className="text-[11px] text-slate-400 block">آخر زيارة للعيادة</span>
                          <span className="text-sm font-bold font-mono text-slate-800">{currentPatientObj?.lastVisit || '2026-09-02'}</span>
                        </div>
                      </div>

                      {/* Timeline of Clinical Treatments */}
                      <div className="space-y-3">
                        <h4 className="text-xs font-bold text-slate-700 flex items-center gap-1.5">
                          <span>⏱️</span>
                          <span>سجل الجلسات والإجراءات الطبية:</span>
                        </h4>
                        <div className="space-y-3">
                          {currentPatientObj?.history && currentPatientObj.history.length > 0 ? (
                            currentPatientObj.history.map((h, i) => (
                              <div key={i} className="p-4 rounded-2xl border border-slate-200 bg-white hover:bg-slate-50 transition flex flex-col md:flex-row md:items-center justify-between gap-3">
                                <div className="space-y-1">
                                  <div className="flex items-center gap-2">
                                    <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-brand-100 text-brand-800">{h.department}</span>
                                    <span className="text-xs font-mono text-slate-400">{h.date}</span>
                                  </div>
                                  <h5 className="font-bold text-sm text-slate-800">{h.procedure}</h5>
                                  <p className="text-xs text-slate-600">الطبيب: {h.doctor}</p>
                                  {h.notes && <p className="text-xs text-slate-500 italic bg-slate-100/60 p-2 rounded-lg">ملاحظات: {h.notes}</p>}
                                </div>
                                <div className="text-left font-mono text-xs font-bold text-slate-700 bg-slate-100 px-3 py-1.5 rounded-xl self-start md:self-center">
                                  جلسة مكتملة ✅
                                </div>
                              </div>
                            ))
                          ) : (
                            <p className="text-xs text-slate-400 italic">لا توجد سجلات تاريخية بعد.</p>
                          )}
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Tab 3: Laboratory Results (Smart Medical Archive) */}
                  {patientTab === 'labs' && (
                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 space-y-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
                        <div>
                          <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                            <span>🧪</span>
                            <span>الأرشيف الطبي لنتائج المختبر والتحاليل</span>
                          </h3>
                          <p className="text-xs text-slate-500 mt-1">نتائج معتمدة ومربوطة رقمياً بالنظام المخبري لمركز سلمي الطبي</p>
                        </div>
                        <span className="text-xs bg-teal-50 text-teal-700 px-3 py-1.5 rounded-full font-bold border border-teal-200 self-start">
                          إجمالي الفحوصات: {currentPatientObj?.labResults?.length || 0}
                        </span>
                      </div>

                      {(!currentPatientObj?.labResults || currentPatientObj.labResults.length === 0) ? (
                        <div className="text-center py-12 text-slate-400">
                          <span className="text-5xl block mb-2">🧪</span>
                          <p className="text-sm font-bold text-slate-600">لا توجد نتائج تحاليل مخبرية مسجلة في ملفك حالياً</p>
                          <p className="text-xs text-slate-400 mt-1">سيتم إدراج النتائج تلقائياً فور اعتمادها من أخصائي المختبر</p>
                        </div>
                      ) : (
                        <div className="space-y-4">
                          {currentPatientObj.labResults.map(lab => (
                            <div key={lab.id} className="border border-slate-200 rounded-2xl p-5 hover:border-brand-400 transition bg-white shadow-sm space-y-4">
                              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-3">
                                <div>
                                  <div className="flex items-center gap-2">
                                    <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-indigo-50 text-indigo-700 border border-indigo-200">
                                      {lab.category}
                                    </span>
                                    <span className="text-xs font-mono text-slate-400">{lab.date}</span>
                                    {lab.reviewed ? (
                                      <span className="text-[10px] font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-200 flex items-center gap-1">
                                        ✓ تمت المراجعة السريرية
                                      </span>
                                    ) : (
                                      <span className="text-[10px] font-bold text-amber-600 bg-amber-50 px-2 py-0.5 rounded-full border border-amber-200">
                                        قيد مراجعة الطبيب
                                      </span>
                                    )}
                                  </div>
                                  <h4 className="text-base font-black text-slate-800 mt-1">{lab.testName}</h4>
                                  <p className="text-xs text-slate-500">الطبيب الطالب: <span className="font-bold text-slate-700">{lab.orderingDoctor}</span></p>
                                </div>

                                <div className="flex items-center gap-2">
                                  {/* Status Flag Badge */}
                                  <span className={"px-3 py-1 rounded-xl text-xs font-black border " + (
                                    lab.status === 'normal' ? 'bg-emerald-50 text-emerald-700 border-emerald-300' :
                                    lab.status === 'abnormal' ? 'bg-amber-50 text-amber-700 border-amber-300' :
                                    'bg-rose-50 text-rose-700 border-rose-300 animate-pulse'
                                  )}>
                                    {lab.status === 'normal' ? '✅ طبيعي (Normal)' : lab.status === 'abnormal' ? '⚠️ غير طبيعي (Abnormal)' : '🚨 تنبيه حرج (Critical)'}
                                  </span>
                                  <button
                                    onClick={() => handleOpenPreviewModal(lab)}
                                    className="px-3.5 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow transition flex items-center gap-1.5"
                                  >
                                    <span>🔍</span>
                                    <span>معاينة التقرير المرفق</span>
                                  </button>
                                </div>
                              </div>

                              {/* Lab Parameters Table */}
                              {lab.parameters && lab.parameters.length > 0 && (
                                <div className="overflow-x-auto rounded-xl border border-slate-100">
                                  <table className="w-full text-xs text-right">
                                    <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-100">
                                      <tr>
                                        <th className="p-2.5">المؤشر المخبري</th>
                                        <th className="p-2.5">النتيجة المقاسة</th>
                                        <th className="p-2.5">الوحدة</th>
                                        <th className="p-2.5">المعدل الطبيعي (Ref. Range)</th>
                                        <th className="p-2.5">التقييم</th>
                                      </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-100">
                                      {lab.parameters.map((param, pIdx) => (
                                        <tr key={pIdx} className="hover:bg-slate-50/70">
                                          <td className="p-2.5 font-bold text-slate-800">{param.name}</td>
                                          <td className="p-2.5 font-mono font-bold text-brand-700">{param.value}</td>
                                          <td className="p-2.5 font-mono text-slate-500">{param.unit}</td>
                                          <td className="p-2.5 font-mono text-slate-500" dir="ltr">{param.referenceRange}</td>
                                          <td className="p-2.5">
                                            <span className={"px-2 py-0.5 rounded text-[10px] font-bold " + (
                                              param.flag === 'normal' ? 'bg-emerald-100 text-emerald-700' :
                                              param.flag === 'abnormal' ? 'bg-amber-100 text-amber-800' :
                                              'bg-rose-100 text-rose-800 font-black'
                                            )}>
                                              {param.flag === 'normal' ? 'طبيعي' : param.flag === 'abnormal' ? 'خارج المعدل' : 'حرج'}
                                            </span>
                                          </td>
                                        </tr>
                                      ))}
                                    </tbody>
                                  </table>
                                </div>
                              )}

                              {lab.notes && (
                                <div className="bg-slate-50 p-3 rounded-xl border border-slate-200/80 text-xs text-slate-700 flex items-start gap-2">
                                  <span className="text-base">📝</span>
                                  <div>
                                    <span className="font-bold block text-slate-800">توصية أخصائي المختبر:</span>
                                    <span>{lab.notes}</span>
                                  </div>
                                </div>
                              )}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* Tab 4: Radiology & Imaging (Smart Medical Archive) */}
                  {patientTab === 'radiology' && (
                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 space-y-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-4">
                        <div>
                          <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                            <span>🩻</span>
                            <span>الأرشيف الطبي للأشعة والتصوير الرقمي</span>
                          </h3>
                          <p className="text-xs text-slate-500 mt-1">أشعة البانوراما، الفحص الرقمي للأسنان، وتصوير الجلد الدقيق (Dermoscopy)</p>
                        </div>
                        <span className="text-xs bg-indigo-50 text-indigo-700 px-3 py-1.5 rounded-full font-bold border border-indigo-200 self-start">
                          إجمالي الصور والأشعة: {currentPatientObj?.radiologyRecords?.length || 0}
                        </span>
                      </div>

                      {(!currentPatientObj?.radiologyRecords || currentPatientObj.radiologyRecords.length === 0) ? (
                        <div className="text-center py-12 text-slate-400">
                          <span className="text-5xl block mb-2">🩻</span>
                          <p className="text-sm font-bold text-slate-600">لا توجد صور أو أشعة مسجلة في ملفك حالياً</p>
                          <p className="text-xs text-slate-400 mt-1">يتم رفع الأشعة الرقمية وتوثيقها فور اكتمال جلسة التصوير</p>
                        </div>
                      ) : (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                          {currentPatientObj.radiologyRecords.map(rad => (
                            <div key={rad.id} className="border border-slate-200 rounded-2xl p-5 hover:border-brand-400 transition bg-white shadow-sm flex flex-col justify-between space-y-4">
                              <div className="space-y-3">
                                <div className="flex items-center justify-between">
                                  <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-purple-50 text-purple-700 border border-purple-200">
                                    {rad.modality}
                                  </span>
                                  <span className="text-xs font-mono text-slate-400">{rad.date}</span>
                                </div>

                                <div>
                                  <h4 className="text-base font-bold text-slate-800">{rad.scanName}</h4>
                                  <p className="text-xs text-slate-500 mt-0.5">
                                    المنطقة المستهدفة: <span className="font-bold text-slate-700">{rad.bodyPart}</span> | الطبيب: <span className="font-bold text-slate-700">{rad.orderingDoctor}</span>
                                  </p>
                                </div>

                                {/* Scan Image Preview Thumbnail */}
                                {rad.imageUrl && (
                                  <div
                                    onClick={() => handleOpenPreviewModal(rad)}
                                    className="relative group cursor-pointer overflow-hidden rounded-xl border border-slate-200 bg-slate-900 aspect-video flex items-center justify-center"
                                  >
                                    <img
                                      src={rad.imageUrl}
                                      alt={rad.scanName}
                                      className="w-full h-full object-cover group-hover:scale-105 transition duration-300 opacity-90 group-hover:opacity-100"
                                    />
                                    <div className="absolute inset-0 bg-slate-900/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center gap-2 text-white font-bold text-xs backdrop-blur-xs">
                                      <span>🔍</span>
                                      <span>تكبير ومعاينة الصورة كاملة</span>
                                    </div>
                                  </div>
                                )}

                                {/* Diagnostic Findings */}
                                <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-xs text-slate-700">
                                  <span className="font-bold block text-slate-800 mb-1">التقرير الإشعاعي والنتائج (Findings):</span>
                                  <p className="text-slate-600 leading-relaxed">{rad.findings}</p>
                                </div>
                              </div>

                              <div className="pt-3 border-t border-slate-100 flex items-center justify-between">
                                <span className={"px-2.5 py-1 rounded-lg text-[10px] font-bold " + (
                                  rad.status === 'normal' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                                )}>
                                  {rad.status === 'normal' ? 'طبيعي - لا توجد تشوهات' : 'ملاحظات مشخصة بحاجة متابعة'}
                                </span>
                                <button
                                  onClick={() => handleOpenPreviewModal(rad)}
                                  className="text-xs font-bold text-brand-600 hover:text-brand-700 hover:bg-brand-50 px-3 py-1.5 rounded-xl transition flex items-center gap-1"
                                >
                                  <span>📄</span>
                                  <span>فتح الملف الطبي</span>
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* Tab 5: Prescriptions */}
                  {patientTab === 'prescriptions' && (
                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 space-y-4">
                      <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                        <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                          <span>💊</span>
                          <span>الوصفات الطبية الإلكترونية المعتمدة</span>
                        </h3>
                        <span className="text-xs text-slate-500 font-medium">إجمالي الوصفات: {currentPatientRx.length}</span>
                      </div>

                      {currentPatientRx.length === 0 ? (
                        <div className="text-center py-12 text-slate-400">
                          <span className="text-4xl block mb-2">💊</span>
                          <p className="text-sm font-bold text-slate-600">لا توجد وصفات إلكترونية مسجلة</p>
                        </div>
                      ) : (
                        <div className="space-y-4">
                          {currentPatientRx.map(rx => (
                            <div key={rx.id} className="p-5 rounded-2xl border border-slate-200 hover:border-brand-400 transition bg-white shadow-xs space-y-4">
                              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-3">
                                <div>
                                  <div className="flex items-center gap-2">
                                    <span className="font-mono text-xs font-bold text-brand-700 bg-brand-50 px-2.5 py-0.5 rounded-full">{rx.id}</span>
                                    <span className="text-xs font-mono text-slate-400">{rx.date}</span>
                                  </div>
                                  <h4 className="text-sm font-bold text-slate-800 mt-1">التشخيص: {rx.diagnosis}</h4>
                                  <p className="text-xs text-slate-500">الطبيب المحرر: {rx.doctorName} ({rx.doctorTitle})</p>
                                </div>
                                <button
                                  onClick={() => handlePrintRx(rx)}
                                  className="px-3.5 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition flex items-center gap-1.5 self-start"
                                >
                                  <span>🖨️</span>
                                  <span>طباعة الوصفة (PDF)</span>
                                </button>
                              </div>

                              {/* Medicines Table */}
                              <div className="overflow-x-auto">
                                <table className="w-full text-xs text-right">
                                  <thead className="bg-slate-50 text-slate-600 font-bold">
                                    <tr>
                                      <th className="p-2 rounded-r-lg">الدواء والتركيز</th>
                                      <th className="p-2">الجرعة</th>
                                      <th className="p-2">التكرار</th>
                                      <th className="p-2">المدة</th>
                                      <th className="p-2 rounded-l-lg">تعليمات الاستخدام</th>
                                    </tr>
                                  </thead>
                                  <tbody className="divide-y divide-slate-100">
                                    {rx.medicines.map((med, mIdx) => (
                                      <tr key={mIdx}>
                                        <td className="p-2 font-bold text-slate-800">{med.name}</td>
                                        <td className="p-2 font-mono">{med.dosage}</td>
                                        <td className="p-2">{med.frequency}</td>
                                        <td className="p-2">{med.duration}</td>
                                        <td className="p-2 text-slate-600">{med.instructions}</td>
                                      </tr>
                                    ))}
                                  </tbody>
                                </table>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* Tab 6: Invoices */}
                  {patientTab === 'invoices' && (
                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 space-y-4">
                      <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                        <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                          <span>🧾</span>
                          <span>الفواتير الضريبية المبسطة (متوافقة مع هيئة الزكاة والضريبة والجمارك ZATCA)</span>
                        </h3>
                        <span className="text-xs text-slate-500 font-medium">إجمالي الفواتير: {currentPatientInvoices.length}</span>
                      </div>

                      {currentPatientInvoices.length === 0 ? (
                        <div className="text-center py-12 text-slate-400">
                          <span className="text-4xl block mb-2">🧾</span>
                          <p className="text-sm font-bold text-slate-600">لا توجد فواتير صادرة بعد</p>
                        </div>
                      ) : (
                        <div className="space-y-4">
                          {currentPatientInvoices.map(inv => (
                            <div key={inv.id} className="p-5 rounded-2xl border border-slate-200 hover:border-brand-400 transition bg-white shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4">
                              <div className="space-y-2">
                                <div className="flex items-center gap-2">
                                  <span className="font-mono text-xs font-black text-brand-700 bg-brand-50 px-2.5 py-0.5 rounded-full">{inv.invoiceNumber}</span>
                                  <span className="text-xs font-mono text-slate-400">{inv.date}</span>
                                  <span className={"px-2.5 py-0.5 rounded-full text-[10px] font-black " + (
                                    inv.status === 'paid' ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'
                                  )}>
                                    {inv.status === 'paid' ? 'مدفوعة بالكامل ✅' : 'قيد السداد'}
                                  </span>
                                </div>
                                <div className="text-xs text-slate-600">
                                  <span className="font-bold text-slate-800">الخدمات: </span>
                                  {inv.items?.map(it => it.description).join(' + ')}
                                </div>
                                <div className="text-xs text-slate-500 flex items-center gap-4">
                                  <span>المبلغ الخاضع للضريبة: <strong className="font-mono">{inv.subtotal} {settings.currency}</strong></span>
                                  <span>ضريبة القيمة المضافة (15%): <strong className="font-mono">{inv.tax} {settings.currency}</strong></span>
                                </div>
                              </div>

                              <div className="flex items-center gap-4 border-t md:border-t-0 md:border-r border-slate-100 pt-3 md:pt-0 md:pr-6">
                                <div>
                                  <span className="text-[11px] text-slate-400 block">الإجمالي الكلي</span>
                                  <span className="text-xl font-black font-mono text-brand-700">{inv.total} {settings.currency}</span>
                                </div>
                                <button
                                  onClick={() => handlePrintInvoice(inv)}
                                  className="px-4 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow transition flex items-center gap-1.5"
                                >
                                  <span>🖨️</span>
                                  <span>عرض الفاتورة ورمز QR</span>
                                </button>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {/* Tab 7: Book Appointment */}
                  {patientTab === 'book' && (
                    <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 max-w-2xl mx-auto space-y-5">
                      <div className="border-b border-slate-100 pb-4">
                        <h3 className="text-base font-bold text-slate-800 flex items-center gap-2">
                          <span>✨</span>
                          <span>طلب حجز موعد إلكتروني جديد</span>
                        </h3>
                        <p className="text-xs text-slate-500 mt-1">اختر القسم والطبيب والوقت المناسب لك ليتم تأكيد الحجز فوراً</p>
                      </div>

                      <form onSubmit={handlePatientBookingSubmit} className="space-y-4">
                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">القسم الطبي</label>
                          <select
                            value={bookingDept}
                            onChange={(e) => setBookingDept(e.target.value)}
                            className="w-full text-xs font-bold p-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 bg-slate-50"
                          >
                            <option value="dental">عيادات طب وجراحة الأسنان</option>
                            <option value="derma">عيادات الجلدية والليزر والتجميل</option>
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">الطبيب المعالج</label>
                          <select
                            value={bookingDoctor}
                            onChange={(e) => setBookingDoctor(e.target.value)}
                            className="w-full text-xs font-bold p-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 bg-slate-50"
                          >
                            {bookingDept === 'dental' ? (
                              <>
                                <option value="د. سلمى العنزي">د. سلمى العنزي (استشارية طب وجراحة الأسنان)</option>
                                <option value="د. محمد السالم">د. محمد السالم (أخصائي تقويم وزراعة الأسنان)</option>
                              </>
                            ) : (
                              <>
                                <option value="د. ريم الشمري">د. ريم الشمري (استشارية الجلدية والليزر والتجميل)</option>
                                <option value="د. خالد القحطاني">د. خالد القحطاني (أخصائي الجلدية والعناية بالبشرة)</option>
                              </>
                            )}
                          </select>
                        </div>

                        <div>
                          <label className="block text-xs font-bold text-slate-700 mb-1">الخدمة / سبب الزيارة</label>
                          <input
                            type="text"
                            required
                            placeholder="مثال: فحص شامل، تنظيف أسنان، جلسة ليزر، جلسة نضارة"
                            value={bookingService}
                            onChange={(e) => setBookingService(e.target.value)}
                            className="w-full text-xs font-medium p-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
                          />
                        </div>

                        <div className="grid grid-cols-2 gap-3">
                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">التاريخ المفضل</label>
                            <input
                              type="date"
                              required
                              value={bookingDate}
                              onChange={(e) => setBookingDate(e.target.value)}
                              className="w-full text-xs font-mono p-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100"
                            />
                          </div>
                          <div>
                            <label className="block text-xs font-bold text-slate-700 mb-1">الوقت المفضل</label>
                            <select
                              value={bookingTime}
                              onChange={(e) => setBookingTime(e.target.value)}
                              className="w-full text-xs font-bold p-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 bg-slate-50"
                            >
                              <option value="09:00 AM">09:00 صباحاً</option>
                              <option value="10:30 AM">10:30 صباحاً</option>
                              <option value="01:00 PM">01:00 ظهراً</option>
                              <option value="04:30 PM">04:30 عصراً</option>
