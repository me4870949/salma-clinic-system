                        <div className="space-y-2.5 max-h-80 overflow-y-auto pr-1">
                          {whatsappLogs.map(log => (
                            <div key={log.id} className="p-3 bg-slate-800/80 rounded-xl border border-slate-700/50 space-y-1 text-xs">
                              <div className="flex items-center justify-between">
                                <span className="font-bold text-emerald-400">{log.patientName}</span>
                                <span className="font-mono text-[10px] text-slate-400">{log.time}</span>
                              </div>
                              <p className="text-slate-300 text-[11px] leading-relaxed line-clamp-3">{log.text}</p>
                              <div className="flex items-center justify-between pt-1 text-[10px] text-slate-400">
                                <span className="font-mono" dir="ltr">{log.phone}</span>
                                <span className="text-emerald-400 font-bold">✓✓ تم التسليم</span>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>

                      <div className="pt-3 border-t border-slate-800 text-[11px] text-slate-400 text-center font-mono">
                        Salma Medical Gateway v2.6
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* ============================================================ */}
              {/* 11. SAAS SYSTEM SETTINGS (/settings)                         */}
              {/* ============================================================ */}
              {currentPath === '/settings' && (
                <div className="space-y-6 max-w-4xl mx-auto">
                  {/* Settings Header */}
                  <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <h3 className="text-lg font-black text-slate-800 flex items-center gap-2">
                        <span>⚙️</span>
                        <span>إعدادات النظام والهوية المؤسسية (White-Label Settings)</span>
                      </h3>
                      <p className="text-xs text-slate-500 mt-0.5">تخصيص اسم المركز، بيانات الزكاة والضريبة ZATCA، ومعلومات الاتصال</p>
                    </div>

                    <button
                      onClick={handleSaveSettings}
                      className="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md transition flex items-center gap-2 self-start sm:self-center"
                    >
                      <span>💾</span>
                      <span>حفظ التعديلات</span>
                    </button>
                  </div>

                  {/* Settings Form */}
                  <div className="bg-white rounded-3xl p-6 shadow-sm border border-slate-100 space-y-5">
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">اسم المركز / العيادة</label>
                        <input
                          type="text"
                          value={settingsForm.name}
                          onChange={(e) => setSettingsForm({ ...settingsForm, name: e.target.value })}
                          className="w-full text-xs font-bold p-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-1 focus:ring-brand-500"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">الرقم الضريبي للمنشأة (ZATCA VAT ID)</label>
                        <input
                          type="text"
                          value={settingsForm.taxNumber}
                          onChange={(e) => setSettingsForm({ ...settingsForm, taxNumber: e.target.value })}
                          className="w-full text-xs font-mono font-bold p-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-1 focus:ring-brand-500"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">رقم السجل التجاري (CR Number)</label>
                        <input
                          type="text"
                          value={settingsForm.crNumber}
                          onChange={(e) => setSettingsForm({ ...settingsForm, crNumber: e.target.value })}
                          className="w-full text-xs font-mono font-bold p-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-1 focus:ring-brand-500"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">رقم الهاتف والتواصل</label>
                        <input
                          type="text"
                          value={settingsForm.phone}
                          onChange={(e) => setSettingsForm({ ...settingsForm, phone: e.target.value })}
                          className="w-full text-xs font-mono font-bold p-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-1 focus:ring-brand-500"
                          dir="ltr"
                        />
                      </div>

                      <div className="sm:col-span-2">
                        <label className="block text-xs font-bold text-slate-700 mb-1">العنوان الجغرافي للمركز</label>
                        <input
                          type="text"
                          value={settingsForm.branch}
                          onChange={(e) => setSettingsForm({ ...settingsForm, branch: e.target.value })}
                          className="w-full text-xs font-medium p-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-1 focus:ring-brand-500"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">رمز العملة</label>
                        <input
                          type="text"
                          value={settingsForm.currency}
                          onChange={(e) => setSettingsForm({ ...settingsForm, currency: e.target.value })}
                          className="w-full text-xs font-bold p-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-1 focus:ring-brand-500"
                        />
                      </div>

                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">نسبة ضريبة القيمة المضافة (%)</label>
                        <input
                          type="number"
                          value={settingsForm.vatRate}
                          onChange={(e) => setSettingsForm({ ...settingsForm, vatRate: Number(e.target.value) })}
                          className="w-full text-xs font-mono font-bold p-3 rounded-xl border border-slate-200 focus:border-brand-500 focus:ring-1 focus:ring-brand-500"
                        />
                      </div>
                    </div>
                  </div>
                </div>
              )}

            </main>
        </div>

        {/* ============================================================ */}
        {/* MODAL 1: INBOUND LAB / RADIOLOGY SYNC MODAL (SHOWUPLOADMODAL)*/}
        {/* ============================================================ */}
        {showUploadModal && (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 overflow-y-auto">
            <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 space-y-5 animate-in fade-in zoom-in duration-200 max-h-[90vh] overflow-y-auto">
              <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                <div className="flex items-center gap-3">
                  <span className="w-10 h-10 rounded-2xl bg-teal-50 text-teal-700 flex items-center justify-center text-xl font-bold">
                    {uploadCategory === 'lab' ? '🧪' : '🩻'}
                  </span>
                  <div>
                    <h3 className="text-base font-black text-slate-800">
                      {uploadCategory === 'lab' ? 'مزامنة وتوثيق نتيجة تحليل مخبري' : 'مزامنة ورفع صورة أشعة وتصوير طبي'}
                    </h3>
                    <p className="text-xs text-slate-500 mt-0.5">ربط فوري ومباشر في السجل الطبي للمريض مع إرسال إشعار WhatsApp</p>
                  </div>
                </div>
                <button
                  onClick={() => setShowUploadModal(false)}
                  className="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition"
                >
                  ✕
                </button>
              </div>

              {/* Type Switcher */}
              <div className="flex rounded-2xl bg-slate-100 p-1 text-xs font-bold">
                <button
                  type="button"
                  onClick={() => setUploadCategory('lab')}
                  className={"flex-1 py-2 rounded-xl transition flex items-center justify-center gap-2 " + (uploadCategory === 'lab' ? 'bg-white text-teal-700 shadow-sm' : 'text-slate-600')}
                >
                  <span>🧪</span>
                  <span>فحص مخبري (Lab Test)</span>
                </button>
                <button
                  type="button"
                  onClick={() => setUploadCategory('radiology')}
                  className={"flex-1 py-2 rounded-xl transition flex items-center justify-center gap-2 " + (uploadCategory === 'radiology' ? 'bg-white text-purple-700 shadow-sm' : 'text-slate-600')}
                >
                  <span>🩻</span>
                  <span>أشعة وتصوير (Radiology / Scan)</span>
                </button>
              </div>

              {/* Inbound Form */}
              <div className="space-y-4">
                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">المريض المستهدف (ربط برقم الملف الطبي)</label>
                  <select
                    value={uploadPatientId}
                    onChange={(e) => setUploadPatientId(e.target.value)}
                    className="w-full text-xs font-bold p-3 rounded-xl border border-slate-200 focus:border-brand-500 bg-slate-50"
                  >
                    {patients.map(p => (
                      <option key={p.id} value={p.id}>
                        {p.name} - رقم الملف: {p.fileNumber} (هوية: {p.nationalId})
                      </option>
                    ))}
                  </select>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      {uploadCategory === 'lab' ? 'اسم الفحص المخبري' : 'نوع الأشعة / الفحص'}
                    </label>
                    <input
                      type="text"
                      required
                      placeholder={uploadCategory === 'lab' ? 'مثال: فحص وظائف الكبد LFT' : 'مثال: أشعة بانوراما للأسنان OPG'}
                      value={uploadTestName}
                      onChange={(e) => setUploadTestName(e.target.value)}
                      className="w-full text-xs p-3 rounded-xl border border-slate-200 focus:border-brand-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      {uploadCategory === 'lab' ? 'تصنيف الفحص' : 'المنطقة المستهدفة'}
                    </label>
                    <input
                      type="text"
                      placeholder={uploadCategory === 'lab' ? 'Hematology / Biochemistry' : 'الفك والأسنان / الجلد'}
                      value={uploadCategory}
                      onChange={(e) => setUploadCategory(e.target.value)}
                      className="w-full text-xs p-3 rounded-xl border border-slate-200 focus:border-brand-500"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">الطبيب المعالج / الطالب</label>
                    <select
                      value={uploadDoctor}
                      onChange={(e) => setUploadDoctor(e.target.value)}
                      className="w-full text-xs font-bold p-3 rounded-xl border border-slate-200 bg-slate-50"
                    >
                      <option value="د. سلمى العنزي">د. سلمى العنزي (استشارية طب وجراحة الأسنان)</option>
                      <option value="د. ريم الشمري">د. ريم الشمري (استشارية الجلدية والليزر)</option>
                      <option value="د. محمد السالم">د. محمد السالم (أخصائي تقويم الأسنان)</option>
                      <option value="د. خالد القحطاني">د. خالد القحطاني (أخصائي الجلدية)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">حالة النتيجة (Status Flag)</label>
                    <select
                      value={uploadStatus}
                      onChange={(e) => setUploadStatus(e.target.value)}
                      className={"w-full text-xs font-black p-3 rounded-xl border " + (
                        uploadStatus === 'normal' ? 'bg-emerald-50 text-emerald-800 border-emerald-300' :
                        uploadStatus === 'abnormal' ? 'bg-amber-50 text-amber-800 border-amber-300' :
                        'bg-rose-50 text-rose-800 border-rose-300'
                      )}
                    >
                      <option value="normal">✅ طبيعي - Normal</option>
                      <option value="abnormal">⚠️ غير طبيعي - Abnormal</option>
                      <option value="critical">🚨 تنبيه حرج - Critical Alert</option>
                    </select>
                  </div>
                </div>

                {uploadCategory === 'lab' ? (
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">النتائج والمؤشرات (Parameters JSON / Text)</label>
                    <textarea
                      rows="3"
                      value={uploadParams}
                      onChange={(e) => setUploadParams(e.target.value)}
                      placeholder='مثال: Hemoglobin: 14.5 g/dL (Normal) | WBC: 7.2 x10^3/uL'
                      className="w-full text-xs p-3 rounded-xl border border-slate-200 font-mono focus:border-brand-500"
                    ></textarea>
                  </div>
                ) : (
                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">التقرير الإشعاعي والملاحظات (Findings)</label>
                    <textarea
                      rows="3"
                      value={uploadParams}
                      onChange={(e) => setUploadParams(e.target.value)}
                      placeholder="اكتب التقرير الإشعاعي وملاحظات فني الأشعة..."
                      className="w-full text-xs p-3 rounded-xl border border-slate-200 focus:border-brand-500"
                    ></textarea>
                  </div>
                )}

                <div>
                  <label className="block text-xs font-bold text-slate-700 mb-1">رابط صورة الأشعة / التقرير المرفق (URL)</label>
                  <input
                    type="text"
                    value={uploadFileUrl}
                    onChange={(e) => setUploadFileUrl(e.target.value)}
                    placeholder="https://images.unsplash.com/photo-..."
                    className="w-full text-xs font-mono p-3 rounded-xl border border-slate-200 focus:border-brand-500"
                    dir="ltr"
                  />
                </div>

                <div className="pt-3 border-t border-slate-100 flex items-center justify-end gap-3">
                  <button
                    type="button"
                    onClick={() => setShowUploadModal(false)}
                    className="px-4 py-2.5 rounded-xl text-slate-600 hover:bg-slate-100 font-bold text-xs transition"
                  >
                    إلغاء
                  </button>
                  <button
                    type="button"
                    onClick={handleInboundUpload}
                    className="px-6 py-2.5 rounded-xl bg-gradient-to-r from-teal-600 to-brand-600 hover:from-teal-700 hover:to-brand-700 text-white font-black text-xs shadow-md transition flex items-center gap-2"
                  >
                    <span>⚡</span>
                    <span>اعتماد ومزامنة النتيجة فورياً</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ============================================================ */}
        {/* MODAL 2: HIGH-RESOLUTION REPORT PREVIEW (SHOWPREVIEWMODAL)   */}
        {/* ============================================================ */}
        {showPreviewModal && previewItem && (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/70 backdrop-blur-xs p-4 overflow-y-auto">
            <div className="bg-white rounded-3xl max-w-3xl w-full p-6 shadow-2xl border border-slate-100 space-y-6 animate-in fade-in zoom-in duration-200 max-h-[92vh] overflow-y-auto">
              <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                <div className="flex items-center gap-3">
                  <span className="w-12 h-12 rounded-2xl bg-brand-50 text-brand-700 flex items-center justify-center text-2xl font-bold">
                    {previewItem.scanName ? '🩻' : '🧪'}
                  </span>
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="px-2.5 py-0.5 rounded-full text-[10px] font-bold bg-slate-100 text-slate-700 font-mono">
                        {previewItem.id}
                      </span>
                      <span className="text-xs font-mono text-slate-400">{previewItem.date}</span>
                    </div>
                    <h3 className="text-lg font-black text-slate-800 mt-0.5">
                      {previewItem.scanName || previewItem.testName}
                    </h3>
                  </div>
                </div>
                <button
                  onClick={() => setShowPreviewModal(false)}
                  className="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition"
                >
                  ✕
                </button>
              </div>

              {/* Status and Doctor Header */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-2xl border border-slate-200 text-xs">
                <div>
                  <span className="text-slate-400 block text-[11px]">الطبيب المشرف</span>
                  <span className="font-bold text-slate-800">{previewItem.orderingDoctor}</span>
                </div>
                <div>
                  <span className="text-slate-400 block text-[11px]">التصنيف / الفئة</span>
                  <span className="font-bold text-slate-800">{previewItem.category || previewItem.modality}</span>
                </div>
                <div>
                  <span className="text-slate-400 block text-[11px]">تقييم الحالة</span>
                  <span className={"font-bold " + (previewItem.status === 'normal' ? 'text-emerald-600' : 'text-rose-600')}>
                    {previewItem.status === 'normal' ? 'طبيعي Normal' : previewItem.status === 'abnormal' ? 'غير طبيعي' : '🚨 تنبيه حرج'}
                  </span>
                </div>
                <div>
                  <span className="text-slate-400 block text-[11px]">المراجعة السريرية</span>
                  <span className="font-bold text-emerald-700">
                    {previewItem.reviewed ? '✓ معتمد سريرياً' : 'قيد المراجعة'}
                  </span>
                </div>
              </div>

              {/* Image Preview if Radiology */}
              {previewItem.imageUrl && (
                <div className="space-y-2">
                  <span className="text-xs font-bold text-slate-700 block">الصورة الإشعاعية الرقمية عالية الدقة:</span>
                  <div className="rounded-2xl overflow-hidden border border-slate-200 bg-slate-950 p-2 flex items-center justify-center">
                    <img
                      src={previewItem.imageUrl}
                      alt={previewItem.scanName || 'Medical Scan'}
                      className="max-h-96 w-auto object-contain rounded-xl"
                    />
                  </div>
                </div>
              )}

              {/* Parameters Table if Lab Test */}
              {previewItem.parameters && (
                <div className="space-y-2">
                  <span className="text-xs font-bold text-slate-700 block">نتائج المؤشرات المخبرية:</span>
                  <div className="overflow-x-auto rounded-xl border border-slate-200">
                    <table className="w-full text-xs text-right">
                      <thead className="bg-slate-50 text-slate-600 font-bold border-b border-slate-200">
                        <tr>
                          <th className="p-2.5">المؤشر</th>
                          <th className="p-2.5">النتيجة</th>
                          <th className="p-2.5">الوحدة</th>
                          <th className="p-2.5">النطاق المرجعي</th>
                          <th className="p-2.5">الحالة</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {previewItem.parameters.map((p, idx) => (
                          <tr key={idx}>
                            <td className="p-2.5 font-bold text-slate-800">{p.name}</td>
                            <td className="p-2.5 font-mono font-bold text-brand-700">{p.value}</td>
                            <td className="p-2.5 font-mono text-slate-500">{p.unit}</td>
                            <td className="p-2.5 font-mono text-slate-500" dir="ltr">{p.referenceRange}</td>
                            <td className="p-2.5 font-bold">
                              <span className={"px-2 py-0.5 rounded text-[10px] " + (
                                p.flag === 'normal' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                              )}>
                                {p.flag === 'normal' ? 'طبيعي' : 'غير طبيعي'}
                              </span>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* Findings & Doctor Notes */}
              {(previewItem.findings || previewItem.notes) && (
                <div className="bg-slate-50 p-4 rounded-2xl border border-slate-200 text-xs text-slate-700 space-y-1">
                  <span className="font-bold text-slate-800 block">تقرير الأخصائي والتشخيص السريري:</span>
                  <p className="leading-relaxed">{previewItem.findings || previewItem.notes}</p>
                </div>
              )}

              {/* Action Buttons */}
              <div className="pt-4 border-t border-slate-100 flex items-center justify-between">
                <button
                  onClick={() => window.print()}
                  className="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition flex items-center gap-1.5"
                >
                  <span>🖨️</span>
                  <span>طباعة التقرير الطبي الكامل</span>
                </button>
                <button
                  onClick={() => setShowPreviewModal(false)}
                  className="px-5 py-2.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs transition"
                >
                  إغلاق المعاينة
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ============================================================ */}
        {/* MODAL 3: PATIENT FULL PROFILE & EMR (SHOWPATIENTDETAILMODAL) */}
        {/* ============================================================ */}
        {showPatientDetailModal && selectedPatient && (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4 overflow-y-auto">
            <div className="bg-white rounded-3xl max-w-4xl w-full p-6 shadow-2xl border border-slate-100 space-y-6 max-h-[90vh] overflow-y-auto">
              <div className="flex items-center justify-between border-b border-slate-100 pb-4">
                <div>
                  <div className="flex items-center gap-2">
                    <span className="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-brand-50 text-brand-700">
                      {selectedPatient.fileNumber}
                    </span>
                    <span className="text-xs text-slate-400 font-mono">هوية: {selectedPatient.nationalId}</span>
                  </div>
                  <h3 className="text-xl font-black text-slate-800 mt-1">{selectedPatient.name}</h3>
                </div>
                <button
                  onClick={() => setShowPatientDetailModal(false)}
                  className="p-2 rounded-xl text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition"
                >
                  ✕
                </button>
              </div>

              {/* Quick EMR Vitals */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-50 p-4 rounded-2xl border border-slate-200 text-xs">
                <div>
                  <span className="text-slate-400 block text-[11px]">العمر والنوع</span>
                  <span className="font-bold text-slate-800">{selectedPatient.age} سنة • {selectedPatient.gender === 'male' ? 'ذكر' : 'أنثى'}</span>
                </div>
                <div>
                  <span className="text-slate-400 block text-[11px]">رقم الجوال</span>
                  <span className="font-mono font-bold text-slate-800" dir="ltr">{selectedPatient.phone}</span>
                </div>
                <div>
                  <span className="text-slate-400 block text-[11px]">فصيلة الدم</span>
                  <span className="font-mono font-bold text-brand-700">{selectedPatient.bloodGroup}</span>
                </div>
                <div>
                  <span className="text-slate-400 block text-[11px]">الحساسية المفرطة</span>
                  <span className="font-bold text-rose-600">{selectedPatient.allergies}</span>
                </div>
              </div>

              {/* Labs Section in EMR Modal */}
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <h4 className="text-sm font-bold text-slate-800 flex items-center gap-2">
                    <span>🧪</span>
                    <span>الفحوصات المخبرية للمريض ({selectedPatient.labResults?.length || 0})</span>
                  </h4>
                  <button
                    onClick={() => {
                      setShowPatientDetailModal(false);
                      handleOpenInboundModal('lab');
                    }}
                    className="text-xs text-teal-600 font-bold hover:underline"
                  >
                    + إضافة تحليل جديد
                  </button>
                </div>
                <div className="space-y-2">
                  {selectedPatient.labResults?.map(l => (
                    <div key={l.id} className="p-3 bg-white border border-slate-200 rounded-xl flex items-center justify-between text-xs">
                      <div>
                        <span className="font-bold text-slate-800">{l.testName}</span>
                        <span className="text-slate-400 text-[11px] block font-mono">🗓️ {l.date} | الطبيب: {l.orderingDoctor}</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <span className={"px-2 py-0.5 rounded text-[10px] font-bold " + (
                          l.status === 'normal' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'
                        )}>
                          {l.status === 'normal' ? 'طبيعي' : 'غير طبيعي'}
                        </span>
                        <button
                          onClick={() => handleOpenPreviewModal(l)}
                          className="px-2.5 py-1 rounded bg-brand-50 hover:bg-brand-100 text-brand-700 font-bold transition"
                        >
                          معاينة
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              {/* Radiology Section in EMR Modal */}
              <div className="space-y-3">
                <div className="flex items-center justify-between">
                  <h4 className="text-sm font-bold text-slate-800 flex items-center gap-2">
                    <span>🩻</span>
                    <span>الأشعة والتصوير الرقمي ({selectedPatient.radiologyRecords?.length || 0})</span>
                  </h4>
                  <button
                    onClick={() => {
                      setShowPatientDetailModal(false);
                      handleOpenInboundModal('radiology');
                    }}
                    className="text-xs text-purple-600 font-bold hover:underline"
                  >
                    + إضافة أشعة جديدة
                  </button>
                </div>
                <div className="space-y-2">
                  {selectedPatient.radiologyRecords?.map(r => (
                    <div key={r.id} className="p-3 bg-white border border-slate-200 rounded-xl flex items-center justify-between text-xs">
                      <div>
                        <span className="font-bold text-slate-800">{r.scanName}</span>
                        <span className="text-slate-400 text-[11px] block font-mono">🗓️ {r.date} | المنطقة: {r.bodyPart}</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => handleOpenPreviewModal(r)}
                          className="px-2.5 py-1 rounded bg-brand-50 hover:bg-brand-100 text-brand-700 font-bold transition"
                        >
                          معاينة الصورة
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="pt-3 border-t border-slate-100 flex justify-end">
                <button
                  onClick={() => setShowPatientDetailModal(false)}
                  className="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition"
                >
                  إغلاق الملف
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ============================================================ */}
        {/* MODAL 4: QUICK APPOINTMENT SLOT BOOKING                      */}
        {/* ============================================================ */}
        {showSlotModal && (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
              <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 className="text-base font-black text-slate-800 flex items-center gap-2">
                  <span>📅</span>
                  <span>حجز موعد فوري جديد</span>
                </h3>
                <button onClick={() => setShowSlotModal(false)} className="text-slate-400 hover:text-slate-600">✕</button>
              </div>

              <form onSubmit={handlePatientBookingSubmit} className="space-y-3 text-xs">
                <div>
                  <label className="block font-bold text-slate-700 mb-1">القسم الطبي</label>
                  <select
                    value={bookingDept}
                    onChange={(e) => setBookingDept(e.target.value)}
                    className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 font-bold"
                  >
                    <option value="dental">عيادات طب وجراحة الأسنان</option>
                    <option value="derma">عيادات الجلدية والتجميل</option>
                  </select>
                </div>

                <div>
                  <label className="block font-bold text-slate-700 mb-1">الطبيب المعالج</label>
                  <select
                    value={bookingDoctor}
                    onChange={(e) => setBookingDoctor(e.target.value)}
                    className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 font-bold"
                  >
                    <option value="د. سلمى العنزي">د. سلمى العنزي</option>
                    <option value="د. ريم الشمري">د. ريم الشمري</option>
                    <option value="د. محمد السالم">د. محمد السالم</option>
                    <option value="د. خالد القحطاني">د. خالد القحطاني</option>
                  </select>
                </div>

                <div>
                  <label className="block font-bold text-slate-700 mb-1">الخدمة المطلوبة</label>
                  <input
                    type="text"
                    required
                    placeholder="كشف، تنظيف، جلسة ليزر..."
                    value={bookingService}
                    onChange={(e) => setBookingService(e.target.value)}
                    className="w-full p-2.5 rounded-xl border border-slate-200"
                  />
                </div>

                <div className="grid grid-cols-2 gap-2">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">التاريخ</label>
                    <input
                      type="date"
                      required
                      value={bookingDate}
                      onChange={(e) => setBookingDate(e.target.value)}
                      className="w-full p-2 rounded-xl border border-slate-200 font-mono"
                    />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">الوقت</label>
                    <select
                      value={bookingTime}
                      onChange={(e) => setBookingTime(e.target.value)}
                      className="w-full p-2 rounded-xl border border-slate-200 bg-slate-50 font-bold"
                    >
                      <option value="09:00 AM">09:00 AM</option>
                      <option value="11:30 AM">11:30 AM</option>
                      <option value="04:30 PM">04:30 PM</option>
                      <option value="07:00 PM">07:00 PM</option>
                    </select>
                  </div>
                </div>

                <div className="pt-3 border-t border-slate-100 flex justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setShowSlotModal(false)}
                    className="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-bold"
                  >
                    إلغاء
                  </button>
                  <button
                    type="submit"
                    className="px-5 py-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold"
                  >
                    تأكيد وحفظ الموعد
                  </button>
                </div>
              </form>
            </div>
          </div>
        )}

        {/* ============================================================ */}
        {/* MODAL 5: DERMATOLOGY & LASER SESSION MODAL                   */}
        {/* ============================================================ */}
        {showDermaModal && (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-xs p-4">
            <div className="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 space-y-4">
              <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 className="text-base font-black text-slate-800 flex items-center gap-2">
                  <span>✨</span>
                  <span>توثيق جلسة ليزر وتجميل متقدمة</span>
                </h3>
                <button onClick={() => setShowDermaModal(false)} className="text-slate-400 hover:text-slate-600">✕</button>
              </div>

              <div className="space-y-3 text-xs">
                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">نوع الجهاز (Device)</label>
                    <select className="w-full p-2.5 rounded-xl border border-slate-200 bg-slate-50 font-bold">
                      <option>Candela GentleMax Pro Plus</option>
                      <option>Clarity II Laser</option>
                      <option>HydraFacial MD</option>
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">طاقة النبضة (Fluence J/cm²)</label>
                    <input type="number" defaultValue="14" className="w-full p-2.5 rounded-xl border border-slate-200 font-mono" />
                  </div>
                </div>

                <div className="grid grid-cols-2 gap-3">
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">حجم البقعة (Spot Size mm)</label>
                    <input type="number" defaultValue="18" className="w-full p-2.5 rounded-xl border border-slate-200 font-mono" />
                  </div>
                  <div>
                    <label className="block font-bold text-slate-700 mb-1">إجمالي النبضات (Pulses)</label>
                    <input type="number" defaultValue="850" className="w-full p-2.5 rounded-xl border border-slate-200 font-mono" />
                  </div>
                </div>

                <div>
                  <label className="block font-bold text-slate-700 mb-1">المناطق المعالجة</label>
                  <input type="text" defaultValue="الوجه والرقبة مع تبريد ديناميكي DCD" className="w-full p-2.5 rounded-xl border border-slate-200" />
                </div>

                <div className="pt-3 border-t border-slate-100 flex justify-end gap-2">
                  <button
                    onClick={() => setShowDermaModal(false)}
                    className="px-4 py-2 rounded-xl text-slate-600 hover:bg-slate-100 font-bold"
                  >
                    إغلاق
                  </button>
                  <button
                    onClick={() => {
                      alert('تم توثيق بيانات جلسة الليزر بنجاح في ملف المريض.');
                      setShowDermaModal(false);
                    }}
                    className="px-5 py-2 rounded-xl bg-pink-600 hover:bg-pink-700 text-white font-bold"
                  >
                    حفظ الجلسة
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

      </div>
    );
  }

  // Render Root Application
  const rootElement = document.getElementById('root');
  if (rootElement) {
    ReactDOM.createRoot(rootElement).render(<App />);
  }
</script>
</body>
</html>
