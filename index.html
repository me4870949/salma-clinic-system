        const inv = invoices.find(i => i.patientId === p.id) || invoices[0];

        txt = txt.replace(/{doctor_name}/g, appt ? appt.doctorName : 'د. سلمى الشمري');
        txt = txt.replace(/{date}/g, appt ? appt.date : '2026-08-27');
        txt = txt.replace(/{time}/g, appt ? appt.time : '18:30');

        txt = txt.replace(/{invoice_id}/g, inv ? inv.invoiceNumber : 'SALMA-2026-0901');

        setWaPhone(p.phone);

        }
      };

        e.preventDefault();
        const found = USERS.find(u => u.email.toLowerCase() === inputEmail.toLowerCase());
        if (found) {
          setUser(found);
          if (found.role === 'doctor') setCurrentPath('/dashboard/doctor');
          else if (found.role === 'receptionist') setCurrentPath('/dashboard/reception');
          else if (found.role === 'finance') setCurrentPath('/dashboard/finance');
          else if (found.role === 'owner') setCurrentPath('/dashboard/owner');
        } else {
          alert('بيانات الدخول غير صحيحة');

          setUser(pUser);
          setSelectedPatient(p);
          setCurrentPath('/dashboard/patient');
          return;
        }

        const target = USERS.find(u => u.role === roleKey) || USERS[0];
        setUser(target);

        else if (roleKey === 'receptionist') setCurrentPath('/dashboard/reception');

          serviceName: slotService,

        setPatients(patients.map(p => p.id === updated.id ? updated : p));

            <div className="mt-6 max-w-xl mx-auto w-full bg-slate-900 border border-slate-800 p-6 sm:p-8 rounded-3xl shadow-2xl">
              <div className="flex bg-slate-800 p-1.5 rounded-2xl mb-6">
                <button type="button" onClick={() => setLoginTab('patient')} className={"flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition " + (loginTab === 'patient' ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow' : 'text-slate-400')}>
                  👤 دخول المرضى (الاسم + الهوية)
                </button>
                <button type="button" onClick={() => setLoginTab('staff')} className={"flex-1 py-2.5 rounded-xl text-xs sm:text-sm font-bold transition " + (loginTab === 'staff' ? 'bg-gradient-to-r from-emerald-600 to-teal-600 text-white shadow' : 'text-slate-400')}>
                  🔑 دخول الكادر الطبي والإداري
                </button>
              </div>

              {loginTab === 'patient' ? (
                <form onSubmit={handlePatientLogin} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 font-bold mb-1">اسم المريض المسجل (Username)</label>
                    <input type="text" value={inputPatientName} onChange={e => setInputPatientName(e.target.value)} placeholder="سارة عبد الله الشمري" className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white text-xs font-bold" />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-bold mb-1">رقم الهوية الوطنية / الإقامة (Password)</label>
                    <input type="password" dir="ltr" value={inputNationalId} onChange={e => setInputNationalId(e.target.value)} placeholder="1092837461" className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white text-xs font-mono font-bold" />
                  </div>
                  <button type="submit" className="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-black rounded-xl text-xs sm:text-sm shadow-lg">
                    دخول إلى بوابة المريض
                  </button>
                </form>
              ) : (
                <form onSubmit={handleStaffLogin} className="space-y-4 text-xs">
                  <div>
                    <label className="block text-slate-300 font-bold mb-1">البريد الإلكتروني المهني</label>
                    <input type="email" dir="ltr" value={inputEmail} onChange={e => setInputEmail(e.target.value)} className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white text-xs font-mono" />
                  </div>
                  <div>
                    <label className="block text-slate-300 font-bold mb-1">كلمة المرور</label>
                    <input type="password" dir="ltr" value={inputPassword} onChange={e => setInputPassword(e.target.value)} className="w-full p-2.5 bg-slate-800 border border-slate-700 rounded-xl text-white text-xs font-mono" />
                  </div>
                  <button type="submit" className="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-black rounded-xl text-xs sm:text-sm shadow-lg">
                    دخول الكادر إلى المنظومة
                  </button>
                </form>
              )}

              <div className="mt-8 pt-6 border-t border-slate-800">
                <div className="text-xs font-bold text-slate-400 mb-3">حسابات تجريبية فورية بنقرة واحدة (5 أدوار):</div>
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2">
                  {DEMO_CREDENTIALS.map(d => (
                    <button key={d.role} onClick={() => handleDemoLogin(d.role)} className="p-3 rounded-xl bg-slate-800 hover:bg-emerald-950/50 border border-slate-700 text-right transition">
                      <div className="text-xs font-black text-white">{d.label}</div>
                      <div className="text-[10px] text-slate-400 mt-0.5">{d.name}</div>
                      <div className="text-[9px] font-mono text-emerald-400 mt-1" dir="ltr">{d.route}</div>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 font-sans" dir="rtl">
          <header className="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => {
                if (user.role === 'patient') setCurrentPath('/dashboard/patient');
                else if (user.role === 'doctor') setCurrentPath('/dashboard/doctor');
                else if (user.role === 'receptionist') setCurrentPath('/dashboard/reception');
                else if (user.role === 'finance') setCurrentPath('/dashboard/finance');
                else if (user.role === 'owner') setCurrentPath('/dashboard/owner');
              }}>
                <div className="w-9 h-9 rounded-xl bg-emerald-600 text-white flex items-center justify-center font-black">🦷</div>
                <div>
                  <h1 className="text-xs sm:text-sm font-black text-slate-900">{CLINIC_INFO.name}</h1>
                  <p className="text-[10px] text-slate-500">{CLINIC_INFO.branch}</p>
                </div>
              </div>

              <div className="flex items-center gap-2">
                <div className="hidden lg:flex bg-slate-100 p-1 rounded-xl">
                  {DEMO_CREDENTIALS.map(d => (
                    <button key={d.role} onClick={() => handleDemoLogin(d.role)} className={"px-2.5 py-1 rounded-lg text-xs font-bold transition " + (user.role === d.role ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500')}>
                      {d.role === 'patient' ? 'مريض' : d.role === 'doctor' ? 'طبيب' : d.role === 'receptionist' ? 'استقبال' : d.role === 'finance' ? 'مالية' : 'مالك'}
                    </button>
                  ))}
                </div>

                <div className="flex items-center gap-2 pr-2 border-r border-slate-200">
                  <div className="hidden sm:block text-left text-xs font-bold text-slate-900">
                    {user.name}
                    <div className="text-[10px] text-slate-500">{user.specialtyName}</div>
                  </div>
                  <button onClick={() => { setUser(null); setCurrentPath('/login'); }} className="text-xs text-rose-600 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-xl font-bold transition">
                    خروج
                  </button>
                </div>
              </div>
            </div>
          </header>

          <div className="flex-1 max-w-7xl w-full mx-auto flex">
            <aside className="w-56 bg-slate-900 text-slate-300 p-4 shrink-0 hidden md:flex flex-col justify-between">
              <div className="space-y-4">
                <div className="text-[10px] font-bold text-slate-500 uppercase px-2">لوحات التحكم</div>
                <div className="space-y-1">
                  {user.role === 'patient' && <button onClick={() => setCurrentPath('/dashboard/patient')} className={"w-full text-right p-2.5 rounded-xl text-xs font-bold " + (currentPath === '/dashboard/patient' ? 'bg-purple-600 text-white' : 'hover:bg-slate-800')}>👤 بوابة المريض</button>}
                  {user.role === 'doctor' && <button onClick={() => setCurrentPath('/dashboard/doctor')} className={"w-full text-right p-2.5 rounded-xl text-xs font-bold " + (currentPath === '/dashboard/doctor' ? 'bg-emerald-600 text-white' : 'hover:bg-slate-800')}>🩺 كشف الطبيب</button>}
                  {['receptionist', 'doctor', 'finance', 'owner'].includes(user.role) && <button onClick={() => setCurrentPath('/dashboard/reception')} className={"w-full text-right p-2.5 rounded-xl text-xs font-bold " + (currentPath === '/dashboard/reception' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800')}>📅 مكتب الاستقبال</button>}
                  {['finance', 'owner'].includes(user.role) && <button onClick={() => setCurrentPath('/dashboard/finance')} className={"w-full text-right p-2.5 rounded-xl text-xs font-bold " + (currentPath === '/dashboard/finance' ? 'bg-cyan-600 text-white' : 'hover:bg-slate-800')}>💼 الإدارة والمالية</button>}
                  {user.role === 'owner' && <button onClick={() => setCurrentPath('/dashboard/owner')} className={"w-full text-right p-2.5 rounded-xl text-xs font-bold " + (currentPath === '/dashboard/owner' ? 'bg-amber-600 text-white' : 'hover:bg-slate-800')}>👑 مالك المركز والعمولات</button>}
                </div>

                <div className="text-[10px] font-bold text-slate-500 uppercase px-2 pt-2">الخدمات والعمليات</div>
                <div className="space-y-1">
                  <button onClick={() => setCurrentPath('/appointments')} className={"w-full text-right p-2 rounded-xl text-xs font-bold " + (currentPath === '/appointments' ? 'bg-emerald-600 text-white' : 'hover:bg-slate-800')}>🗓 جدول المواعيد</button>
                  {user.role !== 'patient' && <button onClick={() => setCurrentPath('/patients')} className={"w-full text-right p-2 rounded-xl text-xs font-bold " + (currentPath === '/patients' ? 'bg-emerald-600 text-white' : 'hover:bg-slate-800')}>👥 سجل المرضى EMR</button>}
                  <button onClick={() => setCurrentPath('/prescriptions')} className={"w-full text-right p-2 rounded-xl text-xs font-bold " + (currentPath === '/prescriptions' ? 'bg-emerald-600 text-white' : 'hover:bg-slate-800')}>📄 الروشتات الطبية</button>
                  <button onClick={() => setCurrentPath('/invoices')} className={"w-full text-right p-2 rounded-xl text-xs font-bold " + (currentPath === '/invoices' ? 'bg-teal-600 text-white' : 'hover:bg-slate-800')}>🧾 فواتير 15% ZATCA</button>
                  {user.role !== 'patient' && <button onClick={() => setCurrentPath('/whatsapp-notifications')} className={"w-full text-right p-2 rounded-xl text-xs font-bold " + (currentPath === '/whatsapp-notifications' ? 'bg-emerald-600 text-white' : 'hover:bg-slate-800')}>💬 إشعارات الواتساب</button>}
                </div>
              </div>
              <div className="text-[10px] text-slate-500 font-bold">مركز سلمي • عرعر</div>
            </aside>

            <main className="flex-1 p-4 sm:p-6 lg:p-8 min-w-0 overflow-y-auto">
              {currentPath === '/dashboard/patient' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-l from-purple-900 via-slate-900 to-emerald-950 rounded-3xl p-6 text-white shadow-xl flex justify-between items-center">
                    <div>
                      <span className="text-xs bg-white/10 px-3 py-1 rounded-full font-bold text-purple-200">بوابة المريض</span>
                      <h2 className="text-2xl font-black mt-2">أهلاً بك، {selectedPatient.name} 🌸</h2>
                      <div className="text-xs text-purple-200 mt-1">الهوية: {selectedPatient.nationalId} | فصيلة الدم: {selectedPatient.bloodGroup}</div>
                    </div>
                    <button onClick={() => { setSlotDate('2026-08-28'); setSlotTime('19:00'); setShowSlotModal(true); }} className="px-4 py-2 bg-emerald-500 text-slate-950 font-black text-xs rounded-xl">+ حجز موعد جديد</button>
                  </div>

                  <div className="flex bg-white p-1.5 rounded-2xl border gap-1 text-xs font-bold">
                    <button onClick={() => setPatientTab('appointments')} className={"flex-1 py-2 rounded-xl " + (patientTab === 'appointments' ? 'bg-slate-900 text-white' : 'text-slate-600')}>مواعيدي</button>
                    <button onClick={() => setPatientTab('emr')} className={"flex-1 py-2 rounded-xl " + (patientTab === 'emr' ? 'bg-emerald-600 text-white' : 'text-slate-600')}>سجلي الطبي EMR</button>
                    <button onClick={() => setPatientTab('prescriptions')} className={"flex-1 py-2 rounded-xl " + (patientTab === 'prescriptions' ? 'bg-teal-600 text-white' : 'text-slate-600')}>روشتاتي</button>
                    <button onClick={() => setPatientTab('invoices')} className={"flex-1 py-2 rounded-xl " + (patientTab === 'invoices' ? 'bg-cyan-600 text-white' : 'text-slate-600')}>فواتيري</button>
                  </div>

                  {patientTab === 'appointments' && (
                    <div className="bg-white rounded-2xl p-6 border shadow-sm space-y-4">
                      <h3 className="text-sm font-black text-slate-900">مواعيدك القادمة والسابقة</h3>
                      <div className="space-y-3">
                        {appointments.filter(a => a.patientId === selectedPatient.id).map(a => (
                          <div key={a.id} className="p-4 rounded-xl border bg-slate-50 flex justify-between items-center text-xs">
                            <div>
                              <div className="font-black text-slate-900">{a.serviceName}</div>
                              <div className="text-slate-500 mt-0.5">مع الطبيب: {a.doctorName} | التاريخ: {a.date} ({a.time})</div>
                            </div>
                            <span className="px-3 py-1 bg-emerald-100 text-emerald-700 font-bold rounded-lg">{a.statusLabel}</span>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {patientTab === 'emr' && (
                    <div className="bg-white rounded-2xl p-6 border shadow-sm space-y-4 text-xs">
                      <h3 className="text-sm font-black text-slate-900">الملف الصحي الإلكتروني (EMR)</h3>
                      <div className="grid grid-cols-2 gap-4 bg-slate-50 p-4 rounded-xl">
                        <div><span className="text-slate-500">الحساسية:</span> <strong className="text-rose-600">{selectedPatient.allergies}</strong></div>
                        <div><span className="text-slate-500">الأمراض المزمنة:</span> <strong>{selectedPatient.chronicDiseases}</strong></div>
                      </div>
                      <h4 className="font-bold mt-4">سجل العناية والتجميل والأسنان:</h4>
                      <div className="space-y-2">
                        {selectedPatient.dermatologyRecords.map((r, i) => (
                          <div key={i} className="p-3 border rounded-xl bg-teal-50/50">
                            <div className="font-bold text-teal-900">{r.treatment} ({r.date})</div>
                            <div className="text-slate-600 mt-1">الطبيب: {r.doctor} | المعايير: {r.parameters}</div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  {patientTab === 'prescriptions' && (
                    <div className="bg-white rounded-2xl p-6 border shadow-sm space-y-4 text-xs">
                      <h3 className="text-sm font-black text-slate-900">الروشتات الطبية الإلكترونية</h3>
                      {prescriptions.filter(r => r.patientId === selectedPatient.id).map(r => (
                        <div key={r.id} className="p-4 border rounded-xl bg-slate-50 space-y-2">
                          <div className="flex justify-between font-bold">
                            <span>{r.diagnosis}</span>
                            <span className="text-emerald-600">{r.id}</span>
                          </div>
                          <div className="text-slate-500">الطبيب: {r.doctorName} ({r.doctorTitle}) - {r.date}</div>
                          <div className="pt-2 border-t space-y-1">
                            {r.items.map((it, idx) => (
                              <div key={idx} className="flex justify-between bg-white p-2 rounded border">
                                <span className="font-bold text-slate-800">{it.drugName}</span>
                                <span className="text-slate-600">{it.dosage} - {it.frequency} ({it.duration})</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}

                  {patientTab === 'invoices' && (
                    <div className="bg-white rounded-2xl p-6 border shadow-sm space-y-4 text-xs">
                      <h3 className="text-sm font-black text-slate-900">الفواتير الضريبية (ZATCA)</h3>
                      {invoices.filter(i => i.patientId === selectedPatient.id).map(inv => (
                        <div key={inv.id} className="p-4 border rounded-xl bg-slate-50 space-y-2">
                          <div className="flex justify-between font-bold">
                            <span>{inv.invoiceNumber}</span>
                            <span className="text-cyan-700">{inv.totalWithVat} ريال (شامل الضريبة)</span>
                          </div>
                          <div className="text-slate-500">التاريخ: {inv.date} | طريقة الدفع: {inv.paymentMethodLabel}</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {currentPath === '/dashboard/doctor' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-l from-emerald-900 via-slate-900 to-teal-950 rounded-3xl p-6 text-white shadow-xl flex justify-between items-center">
                    <div>
                      <span className="text-xs bg-white/10 px-3 py-1 rounded-full font-bold text-emerald-300">عيادة الطبيب</span>
                      <h2 className="text-2xl font-black mt-2">مرحباً بك، {user.name} 🩺</h2>
                      <div className="text-xs text-emerald-200 mt-1">{user.specialtyName} • جاهز لاستقبال الحالات</div>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div className="lg:col-span-1 bg-white p-6 rounded-2xl border shadow-sm space-y-4 text-xs">
                      <h3 className="font-black text-slate-900">قائمة الانتظار في العيادة</h3>
                      <div className="space-y-2">
                        {appointments.filter(a => a.doctorId === user.id || a.status === 'in-progress' || a.status === 'waiting').map(a => (
                          <div key={a.id} className="p-3 border rounded-xl bg-slate-50 flex justify-between items-center">
                            <div>
                              <div className="font-bold text-slate-900">{a.patientName}</div>
                              <div className="text-[10px] text-slate-500">{a.serviceName} ({a.time})</div>
                            </div>
                            <span className="px-2 py-1 bg-emerald-100 text-emerald-800 text-[10px] font-bold rounded">{a.statusLabel}</span>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="lg:col-span-2 bg-white p-6 rounded-2xl border shadow-sm space-y-4 text-xs">
                      <h3 className="font-black text-slate-900">تشخيص الأسنان التفاعلي (Dental Odontogram)</h3>
                      <p className="text-slate-500">اختر السن وسجل الحالة (علاج عصب، حشوة، تركيبات):</p>
                      <div className="grid grid-cols-8 gap-2">
                        {[18, 17, 16, 15, 14, 13, 12, 11, 21, 22, 23, 24, 25, 26, 27, 28].map(n => (
                          <button key={n} onClick={() => setSelectedTooth(n)} className={"p-3 rounded-xl border font-mono font-bold text-center transition " + (selectedTooth === n ? 'bg-emerald-600 text-white' : 'bg-slate-50 hover:bg-slate-100 text-slate-800')}>
                            #{n}
                          </button>
                        ))}
                      </div>
                      {selectedTooth && (
                        <form onSubmit={handleSaveTooth} className="space-y-3 pt-4 border-t">
                          <div className="font-bold text-emerald-700">تسجيل إجراء للسن رقم: #{selectedTooth}</div>
                          <div className="grid grid-cols-2 gap-3">
                            <select value={toothCond} onChange={e => setToothCond(e.target.value)} className="p-2 border rounded-xl">
                              <option value="composite-filling">حشوة تجميلية</option>
                              <option value="root-canal">علاج عصب</option>
                              <option value="crown">تاج زيركون</option>
                            </select>
                            <input type="text" value={toothNote} onChange={e => setToothNote(e.target.value)} placeholder="ملاحظات إضافية..." className="p-2 border rounded-xl" />
                          </div>
                          <button type="submit" className="w-full py-2.5 bg-emerald-600 text-white font-black rounded-xl">حفظ التشخيص في سجل المريض</button>
                        </form>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {currentPath === '/dashboard/reception' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-l from-teal-950 via-slate-900 to-cyan-950 rounded-3xl p-6 text-white shadow-xl flex justify-between items-center">
                    <div>
                      <span className="text-xs bg-white/10 px-3 py-1 rounded-full font-bold text-teal-300">مكتب الاستقبال</span>
                      <h2 className="text-2xl font-black mt-2">إدارة المواعيد والمرضى 📅</h2>
                      <div className="text-xs text-teal-200 mt-1">حجز المواعيد السريعة وإصدار الفواتير</div>
                    </div>
                    <button onClick={() => setShowSlotModal(true)} className="px-4 py-2 bg-teal-500 text-slate-950 font-black text-xs rounded-xl">+ حجز موعد جديد</button>
                  </div>

                  <div className="bg-white rounded-2xl p-6 border shadow-sm space-y-4 text-xs">
                    <h3 className="font-black text-slate-900">جدول مواعيد اليوم في المركز</h3>
                    <div className="space-y-2">
                      {appointments.map(a => (
                        <div key={a.id} className="p-4 border rounded-xl bg-slate-50 flex justify-between items-center">
                          <div>
                            <div className="font-black text-slate-900">{a.patientName} - {a.serviceName}</div>
                            <div className="text-slate-500 mt-0.5">الطبيب: {a.doctorName} | الموعد: {a.date} ({a.time})</div>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className="px-3 py-1 bg-emerald-100 text-emerald-800 font-bold rounded-lg">{a.statusLabel}</span>
                            <button onClick={() => handleCancelAppt(a.id)} className="px-2.5 py-1 bg-rose-50 text-rose-600 rounded font-bold hover:bg-rose-100">إلغاء</button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {currentPath === '/dashboard/finance' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-l from-cyan-950 via-slate-900 to-blue-950 rounded-3xl p-6 text-white shadow-xl">
                    <span className="text-xs bg-white/10 px-3 py-1 rounded-full font-bold text-cyan-300">الإدارة المالية</span>
                    <h2 className="text-2xl font-black mt-2">التقارير المحاسبية وضريبة 15% ZATCA 💼</h2>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                    <div className="bg-white p-5 rounded-2xl border shadow-sm">
                      <div className="text-slate-500">إجمالي الإيرادات (قبل الضريبة)</div>
                      <div className="text-2xl font-black text-slate-900 mt-1">{totalClinicGross} ريال</div>
                    </div>
                    <div className="bg-white p-5 rounded-2xl border shadow-sm">
                      <div className="text-slate-500">إجمالي ضريبة القيمة المضافة (15%)</div>
                      <div className="text-2xl font-black text-emerald-600 mt-1">{totalClinicVat} ريال</div>
                    </div>
                    <div className="bg-white p-5 rounded-2xl border shadow-sm">
                      <div className="text-slate-500">إجمالي الإيرادات (شامل الضريبة)</div>
                      <div className="text-2xl font-black text-cyan-700 mt-1">{totalClinicWithVat} ريال</div>
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl p-6 border shadow-sm space-y-4 text-xs">
                    <h3 className="font-black text-slate-900">سجل الفواتير الضريبية الإلكترونية</h3>
                    <div className="space-y-2">
                      {invoices.map(inv => (
                        <div key={inv.id} className="p-4 border rounded-xl bg-slate-50 flex justify-between items-center">
                          <div>
                            <div className="font-black text-slate-900">{inv.invoiceNumber} - {inv.patientName}</div>
                            <div className="text-slate-500 mt-0.5">الطبيب: {inv.doctorName} | التاريخ: {inv.date}</div>
                          </div>
                          <div className="text-left font-mono font-bold text-cyan-700">
                            {inv.totalWithVat} ريال (شامل 15%)
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {currentPath === '/dashboard/owner' && (
                <div className="space-y-6">
                  <div className="bg-gradient-to-l from-amber-950 via-slate-900 to-orange-950 rounded-3xl p-6 text-white shadow-xl">
                    <span className="text-xs bg-white/10 px-3 py-1 rounded-full font-bold text-amber-300">لوحة المالك والمدير العام</span>
                    <h2 className="text-2xl font-black mt-2">أرباح المركز وعمولات الأطباء 👑</h2>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-xs">
                    <div className="bg-white p-5 rounded-2xl border shadow-sm">
                      <div className="text-slate-500">إجمالي إيرادات العيادة</div>
                      <div className="text-2xl font-black text-slate-900 mt-1">{totalClinicGross} ريال</div>
                    </div>
                    <div className="bg-white p-5 rounded-2xl border shadow-sm">
                      <div className="text-slate-500">إجمالي مستحقات الأطباء (رواتب + عمولات)</div>
                      <div className="text-2xl font-black text-amber-600 mt-1">{totalDoctorComms} ريال</div>
                    </div>
                    <div className="bg-white p-5 rounded-2xl border shadow-sm">
                      <div className="text-slate-500">صافي أرباح المركز التشغيلي</div>
                      <div className="text-2xl font-black text-emerald-600 mt-1">{totalClinicNetProfit} ريال</div>
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl p-6 border shadow-sm space-y-4 text-xs">
                    <h3 className="font-black text-slate-900">إدارة نسب أطباء المركز والرواتب</h3>
                    <div className="space-y-3">
                      {doctorStats.map(doc => (
                        <div key={doc.id} className="p-4 border rounded-xl bg-slate-50 flex justify-between items-center">
                          <div>
                            <div className="font-black text-slate-900">{doc.name} ({doc.specialtyName})</div>
                            <div className="text-slate-500 mt-0.5">الراتب الأساسي: {doc.baseSalary} ريال | نسبة العّمولة: {doc.commissionRate}% | الإيراد المحقق: {doc.gross} ريال</div>
                          </div>
                          <div className="flex items-center gap-2">
                            {editingDocId === doc.id ? (
                              <div className="flex items-center gap-1">
                                <input type="number" value={tempRate} onChange={e => setTempRate(e.target.value)} className="w-16 p-1 border rounded text-center" />
                                <button onClick={() => handleUpdateRate(doc.id)} className="px-2 py-1 bg-emerald-600 text-white rounded">حفظ</button>
                              </div>
                            ) : (
                              <button onClick={() => { setEditingDocId(doc.id); setTempRate(String(doc.commissionRate)); }} className="px-3 py-1 bg-amber-50 text-amber-700 rounded font-bold hover:bg-amber-100">تعديل النسبة</button>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {currentPath === '/appointments' && (
                <div className="bg-white rounded-2xl p-6 border shadow-sm space-y-4 text-xs">
                  <h3 className="text-sm font-black text-slate-900">جدول المواعيد الشامل</h3>
                  <div className="space-y-2">
                    {appointments.map(a => (
                      <div key={a.id} className="p-4 border rounded-xl bg-slate-50 flex justify-between items-center">
                        <div>
                          <div className="font-black text-slate-900">{a.patientName} - {a.serviceName}</div>
                          <div className="text-slate-500 mt-0.5">الطبيب: {a.doctorName} | التاريخ: {a.date} ({a.time})</div>
                        </div>
                        <span className="px-3 py-1 bg-emerald-100 text-emerald-800 font-bold rounded-lg">{a.statusLabel}</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {currentPath === '/patients' && user.role !== 'patient' && (
                <div className="bg-white rounded-2xl p-6 border shadow-sm space-y-4 text-xs">
                  <h3 className="text-sm font-black text-slate-900">سجل المرضى الشامل (EMR Database)</h3>
                  <div className="space-y-3">
                    {patients.map(p => (
                      <div key={p.id} className="p-4 border rounded-xl bg-slate-50 flex justify-between items-center">
                        <div>
                          <div className="font-black text-slate-900">{p.name} (هوية: {p.nationalId})</div>
                          <div className="text-slate-500 mt-0.5">الهاتف: {p.phone} | الحساسية: {p.allergies} | فصيلة الدم: {p.bloodGroup}</div>
                        </div>
                        <button onClick={() => { setSelectedPatient(p); setCurrentPath('/dashboard/patient'); }} className="px-3 py-1.5 bg-emerald-600 text-white font-bold rounded-xl">استعراض الملف</button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {currentPath === '/prescriptions' && (
                <div className="bg-white rounded-2xl p-6 border shadow-sm space-y-4 text-xs">
                  <h3 className="text-sm font-black text-slate-900">أرشيف الروشتات الطبية الإلكترونية</h3>
                  <div className="space-y-3">
                    {prescriptions.map(r => (
                      <div key={r.id} className="p-4 border rounded-xl bg-slate-50 space-y-2">
                        <div className="flex justify-between font-bold">
                          <span>{r.patientName} - {r.diagnosis}</span>
                          <span className="text-emerald-600">{r.id}</span>
                        </div>
                        <div className="text-slate-500">الطبيب: {r.doctorName} | التاريخ: {r.date}</div>
                        <div className="pt-2 border-t space-y-1">
                          {r.items.map((it, idx) => (
                            <div key={idx} className="flex justify-between bg-white p-2 rounded border">
                              <span className="font-bold text-slate-800">{it.drugName}</span>
                              <span className="text-slate-600">{it.dosage} - {it.frequency}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {currentPath === '/invoices' && (
                <div className="bg-white rounded-2xl p-6 border shadow-sm space-y-4 text-xs">
                  <h3 className="text-sm font-black text-slate-900">الفواتير الضريبية (ZATCA 15%)</h3>
                  <div className="space-y-3">
                    {invoices.map(inv => (
                      <div key={inv.id} className="p-4 border rounded-xl bg-slate-50 flex justify-between items-center">
                        <div>
                          <div className="font-black text-slate-900">{inv.invoiceNumber} - {inv.patientName}</div>
                          <div className="text-slate-500 mt-0.5">المبلغ قبل الضريبة: {inv.subtotal} | الضريبة (15%): {inv.vatAmount} ريال</div>
                        </div>
                        <div className="text-left font-mono font-bold text-cyan-700">
                          الإجمالي: {inv.totalWithVat} ريال
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {currentPath === '/whatsapp-notifications' && user.role !== 'patient' && (
                <div className="bg-white rounded-2xl p-6 border shadow-sm space-y-4 text-xs">
                  <h3 className="text-sm font-black text-slate-900">نظام إشعارات الواتساب التلقائي (WAHA / API)</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="space-y-3">
                      <div>
                        <label className="block font-bold mb-1">اختر المريض:</label>
                        <select value={waPatientId} onChange={e => setWaPatientId(e.target.value)} className="w-full p-2.5 border rounded-xl">
                          {patients.map(p => <option key={p.id} value={p.id}>{p.name} ({p.phone})</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block font-bold mb-1">قالب الرسالة:</label>
                        <select value={waTplId} onChange={e => setWaTplId(e.target.value)} className="w-full p-2.5 border rounded-xl">
                          {WHATSAPP_TEMPLATES.map(t => <option key={t.id} value={t.id}>{t.title}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block font-bold mb-1">رقم الواتساب:</label>
                        <input type="text" dir="ltr" value={waPhone} onChange={e => setWaPhone(e.target.value)} className="w-full p-2.5 border rounded-xl font-mono" />
                      </div>
                    </div>
                    <div className="space-y-3 flex flex-col">
                      <label className="block font-bold mb-1">معاينة نص الرسالة الجاهزة للإرسال:</label>
                      <textarea value={waMessage} onChange={e => setWaMessage(e.target.value)} className="w-full flex-1 p-3 border rounded-xl font-mono text-[11px] bg-slate-50" rows="6"></textarea>
                      <button onClick={() => alert('تم إرسال الرسالة بنجاح عبر بوابة الواتساب إلى الرقم: ' + waPhone)} className="w-full py-3 bg-emerald-600 text-white font-black rounded-xl shadow">
                        إرسال الإشعار عبر الواتساب 💬
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </main>
          </div>

          {showSlotModal && (
            <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 text-xs shadow-2xl">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-black text-slate-900">حجز موعد جديد في المركز</h3>
                  <button onClick={() => setShowSlotModal(false)} className="text-slate-400 hover:text-slate-600 font-bold text-base">✕</button>
                </div>
                <form onSubmit={handleSaveSlot} className="space-y-3">
                  <div>
                    <label className="block font-bold mb-1">المريض:</label>
                    <select value={slotPatientId} onChange={e => setSlotPatientId(e.target.value)} className="w-full p-2.5 border rounded-xl font-bold">
                      {patients.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
                    </select>
                  </div>
                  <div>
                    <label className="block font-bold mb-1">التخصص والعيادة:</label>
                    <select value={slotSpecialty} onChange={e => {
                      const sp = e.target.value;
                      setSlotSpecialty(sp);
                      if (sp === 'dental') { setSlotDoctor('د. فهد العنزي'); setSlotService('كشف استشاري وخطة علاج أسنان'); }
                      else { setSlotDoctor('د. سلمى الشمري'); setSlotService('جلسة كشف وعناية جلدية'); }
                    }} className="w-full p-2.5 border rounded-xl font-bold">
                      <option value="dental">طب الأسنان</option>
                      <option value="dermatology">الجلدية والتجميل</option>
                    </select>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block font-bold mb-1">التاريخ:</label>
                      <input type="date" value={slotDate} onChange={e => setSlotDate(e.target.value)} className="w-full p-2.5 border rounded-xl font-mono" />
                    </div>
                    <div>
                      <label className="block font-bold mb-1">الوقت:</label>
                      <select value={slotTime} onChange={e => setSlotTime(e.target.value)} className="w-full p-2.5 border rounded-xl font-mono font-bold">
                        {timeSlots.map(ts => <option key={ts} value={ts}>{ts}</option>)}
                      </select>
                    </div>
                  </div>
                  <button type="submit" className="w-full py-3 bg-emerald-600 text-white font-black rounded-xl shadow-lg mt-2">
                    تأكيد حجز الموعد
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
